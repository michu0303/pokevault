grant all on table vault to anon;
notify pgrst, 'reload schema';</div>
    </details>
  </div>`;
}

/* ---------- navigation ---------- */
function setView(tab){
  state.tab=tab;
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id==="view-"+tab));
  document.querySelectorAll(".bottom-nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  window.scrollTo(0,0);
  renderActive();
}
function renderActive(){
  if(state.tab==="home") renderHome();
  else if(state.tab==="search") renderSearch();
  else if(state.tab==="collection") renderCollection();
  else if(state.tab==="wishlist") renderWishlist();
  else renderSettings();
}

/* ============================================================
   HOME  (dashboard / picker / set detail)
   ============================================================ */
function renderHome(){
  const box=$("#view-home");
  if(state.building){
    box.innerHTML=`<div class="panel"><h3>Building your card database…</h3>
      <p class="hint">Downloading the Pokémon catalog. Keep this screen open — you only do this once.</p>
      <div class="progress"><div id="buildBar" style="width:0%"></div></div>
      <p class="hint" id="buildTxt" style="margin:0">Starting…</p></div>`;
    renderBuildProgress(); return;
  }
  if(!state.catalogMeta||!state.catalog.length){
    box.innerHTML=`<div class="panel"><h3>Set up your card database</h3>
      <p class="hint">PokéVault downloads the full Pokémon catalog — every card and sealed
        product — to this device, so everything works instantly and offline.
        Takes about a minute on wifi; you only do it once.</p>
      <button class="btn block" data-action="build-catalog">Build card database</button></div>`;
    return;
  }
  const hm=state.home;
  if(hm.mode==="picker"){ box.innerHTML=renderPicker(); bindPickerFilter(); return; }
  if(hm.mode==="mysets"){ box.innerHTML=renderMySets(); return; }
  if(hm.mode==="detail"){ box.innerHTML=renderSetDetail(); return; }
  box.innerHTML=renderDashboard();
}

function renderDashboard(){
  const worth=totalWorth();
  let cards=0,sealed=0;
  for(const pid in state.owned){ const e=cat(pid); if(e){ e.sealed?sealed++:cards++; } }

  // Collection Worth
  let html=`<div class="hero">
    <div class="label">Collection Worth</div>
    <div class="value">${money(worth)}</div>
    <div class="sub">${cards} Card${cards===1?"":"s"} · ${sealed} Sealed Item${sealed===1?"":"s"}</div>
  </div>`;

  // Top Cards — your most valuable cards
  const tops=[];
  for(const pid in state.owned){
    const e=cat(pid);
    if(e&&!e.sealed){ const v=productValue(pid); if(v>0) tops.push({pid,e,v}); }
  }
  tops.sort((a,b)=>b.v-a.v);
  html+=`<h2 class="section">Top Cards</h2>`;
  if(tops.length){
    html+=tops.slice(0,3).map(t=>`
      <div class="topcard" data-action="open-product" data-pid="${esc(t.pid)}">
        ${t.e.g?`<img class="tcimg" src="${esc(t.e.g)}" alt="">`:`<div class="tcimg"></div>`}
        <div class="tcinfo">
          <div class="tcnm">${esc(t.e.n)}</div>
          <div class="tcset">${esc(t.e.s)}${t.e.nu?" · "+esc(t.e.nu):""}</div>
        </div>
        <div class="tcval">${money(t.v)}</div>
      </div>`).join("");
  }else{
    html+=`<p class="dashhint">Cards you own appear here, your most valuable first.</p>`;
  }

  // In Progress Sets — tracked sets still being completed
  const tracked=allSetsSorted().filter(s=>isTracked(s.sid));
  const inProgress=tracked.map(s=>({s,st:setStats(s.sid)}))
    .filter(x=>x.st.total&&x.st.owned<x.st.total)
    .sort((a,b)=>{
      const fa=isFav(a.s.sid)?1:0, fb=isFav(b.s.sid)?1:0;
      if(fa!==fb) return fb-fa;
      return (b.st.owned/b.st.total)-(a.st.owned/a.st.total);
    });
  html+=`<h2 class="section">In Progress Sets</h2>`;
  if(inProgress.length){
    html+=inProgress.slice(0,3).map(x=>mySetRow(x.s)).join("");
    html+=`<button class="viewall" data-action="view-mysets">View All</button>`;
  }else if(tracked.length){
    html+=`<p class="dashhint">Every set you track is complete — nice work.</p>
      <button class="viewall" data-action="view-mysets">View All</button>`;
  }else{
    html+=`<p class="dashhint">Track the sets you’re working on to follow your progress here.</p>
      <button class="viewall" data-action="pick-sets">Add a Set</button>`;
  }

  // Latest Sets — newest releases
  const ns=newestSets(12);
  html+=`<h2 class="section">Latest Sets</h2><div class="hscroll">`;
  html+=ns.map(s=>`<div class="newset" data-action="open-set" data-sid="${esc(s.sid)}" data-sn="${esc(s.name)}">
    <div class="nn">${esc(s.name)}</div>
  </div>`).join("");
  html+=`</div>`;

  return html;
}

function renderPicker(){
  const hm=state.home;
  const f=(hm.pickerFilter||"").trim().toLowerCase();
  let sets=allSetsSorted();
  if(f) sets=sets.filter(s=>s.name.toLowerCase().indexOf(f)>-1);
  const so=state.prefs.setSort||"az";
  if(so==="new") sets.sort((a,b)=>cmpSid(b.sid,a.sid));
  else if(so==="old") sets.sort((a,b)=>cmpSid(a.sid,b.sid));
  const trackedN=allSetsSorted().filter(s=>isTracked(s.sid)).length;
  let html=`<button class="back-btn" data-action="back-home">‹ Done</button>
    <h2 class="section">Add sets to track</h2>
    <div class="search-bar"><input type="text" id="pickerFilter" placeholder="Filter sets by name…"
      autocomplete="off" value="${esc(hm.pickerFilter||"")}"></div>
    <div class="chips">
      <button class="${so==="az"?"active":""}" data-action="set-sort" data-s="az">A–Z</button>
      <button class="${so==="new"?"active":""}" data-action="set-sort" data-s="new">Newest first</button>
      <button class="${so==="old"?"active":""}" data-action="set-sort" data-s="old">Oldest first</button>
    </div>
    <p class="muted" style="font-size:12px;margin-bottom:11px">${trackedN} set${trackedN===1?"":"s"} tracked · tap a set to add or remove it</p>`;
  html+=sets.map(s=>{
    const t=isTracked(s.sid), st=setStats(s.sid);
    return `<div class="set-row ${t?"tracked":""}" data-action="toggle-track" data-sid="${esc(s.sid)}">
      <div class="si">
        <div class="sn">${esc(s.name)}</div>
        <div class="smeta">${st.total} card${st.total===1?"":"s"}${st.sealedTotal?` · ${st.sealedTotal} sealed`:""}${st.owned>0?` · you own ${st.owned}`:""}</div>
      </div>
      <span class="track-btn ${t?"on":""}">${t?"Added":"Add"}</span>
    </div>`;
  }).join("");
  if(!sets.length) html+=`<div class="empty"><p>No sets match “${esc(hm.pickerFilter)}”.</p></div>`;
  return html;
}
function bindRaritySel(){
  const sel=$("#raritySel"); if(!sel) return;
  sel.addEventListener("change",()=>{ state.home.rarity=sel.value; state.home.page=0; renderHome(); });
}
function bindPickerFilter(){
  const inp=$("#pickerFilter"); if(!inp) return;
  inp.addEventListener("input",()=>{
    state.home.pickerFilter=inp.value;
    clearTimeout(bindPickerFilter._t);
    bindPickerFilter._t=setTimeout(()=>{
      const fc=document.activeElement===inp;
      const ss=inp.selectionStart, se=inp.selectionEnd;
      renderHome();
      if(fc){ const ni=$("#pickerFilter"); if(ni){ ni.focus(); try{ni.setSelectionRange(ss,se);}catch(e){} } }
    },160);
  });
}

function mySetRow(s){
  const st=setStats(s.sid);
  const pct=st.total?Math.round(st.owned/st.total*100):0;
  const fav=isFav(s.sid);
  return `<div class="set-row" data-action="open-set" data-sid="${esc(s.sid)}" data-sn="${esc(s.name)}">
    <button class="starbtn ${fav?"on":""}" data-action="toggle-fav" data-sid="${esc(s.sid)}" aria-label="Pin to dashboard">${SVG_STAR}</button>
    <div class="si">
      <div class="sn">${esc(s.name)}</div>
      <div class="smeta">${st.total?`${st.owned}/${st.total} Cards · ${pct}%`:"Sealed only"}</div>
      ${st.total?`<div class="minibar"><div style="width:${pct}%"></div></div>`:""}
    </div>
    <div class="sval">${money(st.value+st.sealedVal)}<span>VALUE</span></div>
  </div>`;
}
function renderMySets(){
  const list=allSetsSorted().filter(s=>isTracked(s.sid))
    .map(s=>({s,st:setStats(s.sid)}))
    .sort((a,b)=>{
      const fa=isFav(a.s.sid)?1:0, fb=isFav(b.s.sid)?1:0;
      if(fa!==fb) return fb-fa;
      return (b.st.total?b.st.owned/b.st.total:0)-(a.st.total?a.st.owned/a.st.total:0);
    });
  let html=`<button class="back-btn" data-action="back-home">‹ Home</button>
    <div class="rowhead"><h2>Your sets (${list.length})</h2>
      <button class="btn sm" data-action="pick-sets">+ Add sets</button></div>`;
  if(!list.length){
    html+=`<div class="empty"><p>No sets tracked yet.</p>
      <div style="margin-top:14px"><button class="btn" data-action="pick-sets">Add a set</button></div></div>`;
  }else{
    html+=`<p class="muted" style="font-size:12px;margin-bottom:10px">Tap a star to pin a set to your dashboard. Pinned sets show first.</p>`;
    html+=list.map(x=>mySetRow(x.s)).join("");
  }
  return html;
}
/* star = track + pin to dashboard, kept in sync (one tap does both) */
function toggleSetStar(sid){
  sid=String(sid);
  if(isTracked(sid)){ delete state.tracked[sid]; delete state.favorites[sid]; }
  else { state.tracked[sid]=1; state.favorites[sid]=1; }
  saveTracked(); saveFav();
}
/* every (product, variant) printing in a same-number card group */
function groupPrintings(grp){
  const out=[];
  for(const p of grp.products){
    const pat=patternOf(p.n);
    for(const v of variantsFor(p.i)) out.push({pid:p.i,variant:v,label:pat||shortVariant(v)});
  }
  return out;
}
function shortVariant(v){
  const s=String(v||"");
  if(/reverse/i.test(s)) return "Reverse";
  if(/^normal$/i.test(s)||/^default$/i.test(s)) return "Normal";
  if(/master\s*ball/i.test(s)) return "Master";
  if(/pok[eé]\s*ball/i.test(s)) return "Poké Ball";
  if(/holo/i.test(s)) return "Holo";
  if(/energy/i.test(s)) return "Energy";
  return s.length>9?s.slice(0,9):s;
}
function vtog(p){
  const owned=getQty(p.pid,p.variant)>0;
  const lbl=p.label||shortVariant(p.variant);
  return `<button class="vtog ${owned?"on":""}" data-action="own-toggle" data-pid="${esc(p.pid)}" data-variant="${esc(p.variant)}" aria-label="${esc(lbl)}">
    <span class="vtcirc">${owned?SVG_BADGE_FULL:SVG_CIRCLE_O}</span>
    <span class="vtlbl">${esc(lbl)}</span>
  </button>`;
}
function setRowOpenAttr(grp,sid){
  return grp.products.length===1
    ? `data-action="open-product" data-pid="${esc(grp.products[0].i)}"`
    : `data-action="open-group" data-sid="${esc(sid)}" data-gname="${esc(grp.key)}"`;
}
function setListRow(grp,sid){
  const img=(grp.products.find(p=>p.g)||{}).g||"";
  return `<div class="setrow">
    <div class="srtap" ${setRowOpenAttr(grp,sid)}>
      ${img?`<img class="srthumb" loading="lazy" src="${esc(img)}" alt="">`:`<div class="srthumb"></div>`}
      <div class="srmeta">
        <div class="srnm">${esc(grp.name)}</div>
        ${grp.number?`<div class="srnum">${esc(grp.number)}</div>`:""}
      </div>
    </div>
    <div class="srtogs">${groupPrintings(grp).map(vtog).join("")}</div>
  </div>`;
}
function setBinderTile(grp,sid){
  const img=(grp.products.find(p=>p.g)||{}).g||"";
  const badges=groupPrintings(grp).slice(0,4)
    .map(p=>`<span class="bt-b">${getQty(p.pid,p.variant)>0?svgBinderCheck():SVG_CIRCLE_O}</span>`).join("");
  return `<div class="btile" ${setRowOpenAttr(grp,sid)}>
    <div class="btimg">
      ${img?`<img loading="lazy" src="${esc(img)}" alt="">`:""}
      <div class="btbadges">${badges}</div>
    </div>
    <div class="btinfo">
      <div class="btnm">${esc(grp.name)}</div>
      ${grp.number?`<div class="btnum">${esc(grp.number)}</div>`:""}
    </div>
  </div>`;
}
/* shared paginator — kind "home" (page-*) or "col" (col-page) */
function pagenavHtml(pg,pages,kind){
  const pad=n=>String(n).padStart(2,"0");
  const btn=(dp,cls,dis,svg)=> kind==="col"
    ? `<button class="${cls}" data-action="col-page" data-p="${dp}" ${dis?"disabled":""} aria-label="${dp}">${svg}</button>`
    : `<button class="${cls}" data-action="page-${dp}" ${dis?"disabled":""} aria-label="${dp}">${svg}</button>`;
  return `<div class="pagenav">
    ${btn("first","pgdbl",pg<=0,SVG_DBLARROW)}
    ${btn("prev","pgcaret pgprev",pg<=0,SVG_CARET)}
    <span class="pg">Page ${pad(pg+1)} / ${pad(pages)}</span>
    ${btn("next","pgcaret pgnext",pg>=pages-1,SVG_CARET)}
    ${btn("last","pgdbl flip",pg>=pages-1,SVG_DBLARROW)}
  </div>`;
}
function renderSetDetail(){
  const hm=state.home, tracked=isTracked(hm.setId);
  let html=`<div class="setdhd">
    <button class="wlback" data-action="set-back" aria-label="Back">‹</button>
    <span class="setdttl">${esc(hm.setName)}</span>
    <button class="starbtn ${tracked?"on":""}" data-action="toggle-set-star" data-sid="${esc(hm.setId)}" aria-label="${tracked?"Untrack this set":"Track this set"}">${SVG_STAR}</button>
  </div>
  <div class="cardtoggle">
    <button class="${hm.section!=="sealed"?"active":""}" data-action="set-section" data-section="cards">Cards</button>
    <button class="${hm.section==="sealed"?"active":""}" data-action="set-section" data-section="sealed">Sealed</button>
  </div>`;
  if(hm.section==="sealed"){
    const seal=sealedInSet(hm.setId), st=setStats(hm.setId);
    html+= seal.length
      ? `<p class="muted" style="font-size:12px;margin:2px 0 11px">${st.sealedOwned} of ${st.sealedTotal} owned · ${money(st.sealedVal)}</p>`
        +seal.map(sealedRow).join("")
      : `<div class="empty"><p>No sealed products listed for this set.</p></div>`;
    return html;
  }
  const grpRarity=g=>((g.products[0]||{}).r)||"";
  let allGroups=groupsInSet(hm.setId);
  // Black Bolt / White Flare (English only) — only the Illustration & Special
  // Illustration Rares are collected from these sets, so hide everything else.
  // The Japanese releases use different rarity names — leave those untouched.
  const sgrp=state.bySet.get(hm.setId);
  if((!sgrp||sgrp.cat!==CAT_JP)&&/black bolt|white flare/i.test(hm.setName||""))
    allGroups=allGroups.filter(g=>/illustration rare/i.test(grpRarity(g)));
  const rarities=Array.from(new Set(allGroups.map(grpRarity).filter(Boolean))).sort();
  const rf=(hm.rarity&&rarities.indexOf(hm.rarity)>-1)?hm.rarity:"";
  // a card counts as "owned" only when every printing is collected; anything
  // less (none OR partial) is still "missing" — so partials show under Missing
  const og=grp=>groupState(grp)==="complete";
  const scope=rf?allGroups.filter(g=>grpRarity(g)===rf):allGroups;
  let sOwned=0,sValue=0;
  for(const grp of scope){ if(og(grp)) sOwned++; for(const p of grp.products) sValue+=productValue(p.i); }
  const sTotal=scope.length, pct=sTotal?Math.round(sOwned/sTotal*100):0;
  // progress card
  html+=`<div class="setprog">
    <div class="sphead">
      <div>
        <div class="splabel">Progress</div>
        <div class="sppct">${pct}%</div>
        <div class="spcount">${sOwned} of ${sTotal} cards</div>
      </div>
      <div class="spval"><div class="v">${money(sValue)}</div><div class="l">Total Value</div></div>
    </div>
    <div class="spbar"><div style="width:${pct}%"></div></div>
  </div>`;
  // rarity dropdown
  html+=`<div class="rfilter">
    <button class="fdrop ${hm.rarityOpen?"open":""}" data-action="set-rarity-toggle">
      <span>${rf?esc(rf):"All Rarities"}</span>${SVG_CARET}
    </button>`;
  if(hm.rarityOpen){
    const opt=(val,on,label)=>`<button class="fopt ${on?"on":""}" data-action="set-rarity-pick" data-val="${esc(val)}"><span class="foptcheck"></span><span class="foptlbl">${esc(label)}</span></button>`;
    html+=`<div class="fdroplist"><div class="fdropopts">
      ${opt("",!rf,"All Rarities")}
      ${rarities.map(r=>opt(r,rf===r,r)).join("")}
    </div></div>`;
  }
  html+=`</div>`;
  // filter pills + list/binder toggle
  let groups=scope.slice();
  if(hm.filter==="owned") groups=groups.filter(og);
  else if(hm.filter==="missing") groups=groups.filter(g=>!og(g));
  const flt=hm.filter||"all";
  html+=`<div class="setfltrow">
    <div class="setpills">
      <button class="${flt==="all"?"active":""}" data-action="set-filter" data-filter="all">All</button>
      <button class="${flt==="owned"?"active":""}" data-action="set-filter" data-filter="owned">Owned</button>
      <button class="${flt==="missing"?"active":""}" data-action="set-filter" data-filter="missing">Missing</button>
    </div>
    <div class="lbtoggle">
      <button class="${!state.prefs.binder?"active":""}" data-action="view-mode" data-v="list">List</button>
      <button class="${state.prefs.binder?"active":""}" data-action="view-mode" data-v="binder">Binder</button>
    </div>
  </div>`;
  if(!groups.length){
    html+=`<div class="empty"><p>${flt==="missing"?"You have every card in this view!":flt==="owned"?"You haven’t completed any of these yet.":"No cards to show."}</p></div>`;
    return html;
  }
  if(state.prefs.binder){
    const per=12;
    const pages=Math.max(1,Math.ceil(groups.length/per));
    let pg=Math.min(Math.max(0,hm.page||0),pages-1); hm.page=pg;
    html+=`<div class="binder c4">`+groups.slice(pg*per,pg*per+per).map(g=>setBinderTile(g,hm.setId)).join("")+`</div>`;
    if(pages>1) html+=pagenavHtml(pg,pages,"home");
  }else{
    html+=groups.map(g=>setListRow(g,hm.setId)).join("");
  }
  return html;
}

function cardTile(c,plain){
  const pr=priceOf(c.i,primaryVariant(c.i));
  if(plain){
    // search results: every card fully visible, no ownership state —
    // ownership is managed in the card modal after tapping
    return `<div class="tile" data-action="open-product" data-pid="${esc(c.i)}">
      <div class="imgwrap">
        ${c.g?`<img loading="lazy" src="${esc(c.g)}" alt="">`:`<span class="ph">No image</span>`}
        ${c.cat===CAT_JP?`<span class="tag jp">JP</span>`:(c.sealed?`<span class="tag">SEALED</span>`:"")}
      </div>
      <div class="info">
        <div class="nm">${esc(c.n)}${c.nu?" · "+esc(c.nu):""}</div>
        <div class="pr">${pr!=null?money(pr):'<span class="muted">—</span>'}</div>
      </div>
    </div>`;
  }
  const tot=ownedTotal(c.i);
  const os=ownState(c.i);
  const tileCls=os==="complete"?"owned":os==="partial"?"partial":"unowned";
  const qCls=os==="complete"?"on":os==="partial"?"partial":"";
  const qIcon=os==="complete"?SVG_BADGE_FULL:os==="partial"?SVG_BADGE_PART:SVG_BADGE_NONE;
  return `<div class="tile ${tileCls}" data-action="open-product" data-pid="${esc(c.i)}">
    <div class="imgwrap">
      ${c.g?`<img loading="lazy" src="${esc(c.g)}" alt="">`:`<span class="ph">No image</span>`}
      ${c.cat===CAT_JP?`<span class="tag jp">JP</span>`:(c.sealed?`<span class="tag">SEALED</span>`:"")}
      <button class="qbtn ${qCls}" data-action="quick-toggle" data-pid="${esc(c.i)}" aria-label="Toggle owned">${qIcon}</button>
      ${tot>1?`<span class="cntbadge">×${tot}</span>`:""}
    </div>
    <div class="info">
      <div class="nm">${esc(c.n)}${c.nu?" · "+esc(c.nu):""}</div>
      <div class="pr">${pr!=null?money(pr):'<span class="muted">—</span>'}</div>
    </div>
  </div>`;
}
function groupTile(grp,sid){
  if(grp.products.length===1) return cardTile(grp.products[0]);
  let tot=0,ownedV=0;
  for(const p of grp.products){ const t=ownedTotal(p.i); tot+=t; if(t>0) ownedV++; }
  const img=(grp.products.find(p=>p.g)||{}).g||"";
  const gs=groupState(grp);
  const tileCls=gs==="complete"?"owned":gs==="partial"?"partial":"unowned";
  const qCls=gs==="complete"?"on":gs==="partial"?"partial":"";
  const qIcon=gs==="complete"?SVG_BADGE_FULL:gs==="partial"?SVG_BADGE_PART:SVG_BADGE_NONE;
  return `<div class="tile ${tileCls}" data-action="open-group" data-sid="${esc(sid)}" data-gname="${esc(grp.key)}">
    <div class="imgwrap">
      ${img?`<img loading="lazy" src="${esc(img)}" alt="">`:`<span class="ph">No image</span>`}
      <span class="tag grp">${grp.products.length} VERSIONS</span>
      <button class="qbtn ${qCls}" data-action="quick-toggle-group" data-sid="${esc(sid)}" data-gname="${esc(grp.key)}" aria-label="Toggle owned">${qIcon}</button>
      ${tot>1?`<span class="cntbadge">×${tot}</span>`:""}
    </div>
    <div class="info">
      <div class="nm">${grp.number?"#"+esc(grp.number)+" ":""}${esc(grp.name)}</div>
      <div class="vers">${ownedV}/${grp.products.length} versions owned</div>
    </div>
  </div>`;
}
function sealedRow(c){
  const v=variantsFor(c.i)[0];
  const qty=getQty(c.i,v), pr=priceOf(c.i,v);
  return `<div class="srow ${qty?"owned":""}">
    <div class="srimg">${c.g?`<img src="${esc(c.g)}" alt="">`:""}</div>
    <div class="srinfo" data-action="open-product" data-pid="${esc(c.i)}">
      <div class="nm">${esc(c.n)}</div>

let _raritiesCache=null;
function allRarities(){
  if(_raritiesCache) return _raritiesCache;
  const s=new Set();
  for(const c of state.catalog){ if(c.r) s.add(c.r); }
  _raritiesCache=Array.from(s).sort((a,b)=>a.localeCompare(b));
  return _raritiesCache;
}
function toggleArr(arr,v){ const i=arr.indexOf(v); if(i<0) arr.push(v); else arr.splice(i,1); }
function activeFilterCount(){
  const f=state.search.filters; let n=0;
  if(f.type!=="all") n++;
  if(f.lang!=="all") n++;
  if(f.rarity.length) n++;
  if(f.set.length) n++;
  return n;
}
function filteredResults(){
  let res=searchCatalog(state.search.term);
  const f=state.search.filters;
  if(f.type==="cards") res=res.filter(c=>!c.sealed);
  else if(f.type==="sealed") res=res.filter(c=>!!c.sealed);
  if(f.lang==="en") res=res.filter(c=>c.cat!==CAT_JP);
  else if(f.lang==="jp") res=res.filter(c=>c.cat===CAT_JP);
  if(f.rarity.length) res=res.filter(c=>f.rarity.indexOf(c.r||"")>-1);
  if(f.set.length) res=res.filter(c=>f.set.indexOf(String(c.sid))>-1);
  if(f.sort==="val-hi"||f.sort==="val-lo"){
    const val=c=>priceOf(c.i,primaryVariant(c.i))||0;
    res=res.slice().sort((a,b)=>f.sort==="val-hi"?val(b)-val(a):val(a)-val(b));
  }else if(f.sort==="name-az"||f.sort==="name-za"){
    res=res.slice().sort((a,b)=>{const c=(a.n||"").localeCompare(b.n||"");return f.sort==="name-az"?c:-c;});
  }else if(f.sort==="lang-en"||f.sort==="lang-jp"){
    const jp=c=>c.cat===CAT_JP?1:0;
    res=res.slice().sort((a,b)=>{const d=f.sort==="lang-en"?jp(a)-jp(b):jp(b)-jp(a);return d||(a.n||"").localeCompare(b.n||"");});
  }else if(f.sort==="date-new"||f.sort==="date-old"){
    res=res.slice().sort((a,b)=>{
      const da=setDate(a.sid),db=setDate(b.sid);
      if(da===db) return (a.n||"").localeCompare(b.n||"");
      if(!da) return 1; if(!db) return -1;          // undated sets sort last
      return f.sort==="date-new"?(da<db?1:-1):(da<db?-1:1);
    });
  }
  return res;
}

function wlAllEntries(){ return Object.keys(state.wishlist).map(p=>cat(p)).filter(Boolean); }
/* apply the shared wishlist sort + filters to a list of catalog entries */
function wlSortFilter(entries){
  const f=state.wlflt;
  let l=entries.slice();
  if(f.lang==="en") l=l.filter(e=>e.cat!==CAT_JP);
  else if(f.lang==="jp") l=l.filter(e=>e.cat===CAT_JP);
  if(f.rarity.length) l=l.filter(e=>f.rarity.indexOf(e.r||"")>-1);
  if(f.set.length) l=l.filter(e=>f.set.indexOf(String(e.sid))>-1);
  const val=e=>priceOf(e.i,primaryVariant(e.i))||0;
  const jp=e=>e.cat===CAT_JP?1:0;
  if(f.sort==="val-lo") l.sort((a,b)=>val(a)-val(b));
  else if(f.sort==="name-az") l.sort((a,b)=>(a.n||"").localeCompare(b.n||""));
  else if(f.sort==="name-za") l.sort((a,b)=>(b.n||"").localeCompare(a.n||""));
  else if(f.sort==="lang-en") l.sort((a,b)=>(jp(a)-jp(b))||val(b)-val(a));
  else if(f.sort==="lang-jp") l.sort((a,b)=>(jp(b)-jp(a))||val(b)-val(a));
  else if(f.sort==="date-new"||f.sort==="date-old") l.sort((a,b)=>{
    const da=setDate(a.sid),db=setDate(b.sid);
    if(da===db) return val(b)-val(a);
    if(!da) return 1; if(!db) return -1;
    return f.sort==="date-new"?(da<db?1:-1):(da<db?-1:1);
  });
  else l.sort((a,b)=>val(b)-val(a));
  return l;
}
function wlActiveFilterCount(){
  const f=state.wlflt; let n=0;
  if(f.lang!=="all") n++;

function exportData(){
  const payload={app:"PokéVault",version:4,exportedAt:new Date().toISOString(),
    owned:state.owned,wishlist:state.wishlist,tracked:state.tracked,
    favorites:state.favorites,wishFolders:state.wishFolders,history:state.history};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="pokevault-backup-"+today()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>{try{URL.revokeObjectURL(a.href);}catch(e){}},4000);
  toast("Backup file downloaded");
}
function handleImport(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const d=JSON.parse(reader.result);
      let owned=d.owned;
      if(!owned&&Array.isArray(d.collection)){
        owned={};
        for(const it of d.collection){
          if(!it||it.productId==null) continue;
          const pid=String(it.productId),v=it.variant||"Default";
          owned[pid]=owned[pid]||{}; owned[pid][v]=(owned[pid][v]||0)+(it.qty|0||1);
        }
      }
      if(!owned||typeof owned!=="object") throw new Error("bad");
      if(!confirm("Import this backup? It replaces your current collection, wishlist, wishlist folders and tracked sets.")) return;
      state.owned=owned;
      state.wishlist=(d.wishlist&&typeof d.wishlist==="object")?d.wishlist:{};
      state.tracked=(d.tracked&&typeof d.tracked==="object")?d.tracked:{};
      state.favorites=(d.favorites&&typeof d.favorites==="object")?d.favorites:{};
      state.wishFolders=normFolders(d.wishFolders);
      if(Array.isArray(d.history)) state.history=d.history;
      saveOwned(); saveWish(); saveTracked(); saveFav(); saveWishFolders(); saveHistory(); persistPrices();
      renderSettings(); setView("collection");
      toast("Backup imported");
    }catch(e){ toast("Couldn’t read that file — is it a PokéVault backup?"); }
  };
  reader.readAsText(file);
}
function clearCollection(){
  if(!Object.keys(state.owned).length){ toast("Your collection is already empty"); return; }
  if(!confirm("Delete your ENTIRE collection? Export a backup first if unsure. Your wishlist is not affected.")) return;
  state.owned={};
  saveOwned(); persistPrices();
  renderActive(); toast("Collection cleared");
}
function clearWishlist(){
  if(!Object.keys(state.wishlist).length){ toast("Your wishlist is already empty"); return; }
  if(!confirm("Delete your ENTIRE wishlist? Export a backup first if unsure. Your folders are kept but emptied; your collection is not affected.")) return;
  state.wishlist={};
  for(const f of state.wishFolders) f.items={};
  state.wl.folder=null;
  saveWish(); saveWishFolders(); persistPrices();
  renderActive(); toast("Wishlist cleared");
}
async function refreshValues(){
  const btn=$("#refreshBtn");
  const ids=new Set();
  for(const pid of [...Object.keys(state.owned),...Object.keys(state.wishlist)]){
    const e=cat(pid); if(e) ids.add(e.sid);
  }
  if(!ids.size){ toast("Nothing to refresh"); return; }
  if(btn) btn.disabled=true;
  let done=0,failed=0;
  for(const sid of ids){
    done++; if(btn) btn.textContent="Refreshing "+done+"/"+ids.size+"…";
    try{ await getSetPricing(sid,true); }catch(e){ failed++; }
    await new Promise(r=>setTimeout(r,80));
  }
  logSnapshot();
  renderActive();
  toast(failed?("Values updated ("+failed+" set"+(failed===1?"":"s")+" failed)"):"Values updated");
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]");
  if(!el) return;
  const a=el.dataset.action, pid=el.dataset.pid, v=el.dataset.variant;
  if(a==="nav"){
    // tapping the Home tab always returns to the dashboard, even from a set detail
    if(el.dataset.tab==="home") state.home={mode:"dashboard",setId:null,setName:"",section:"cards",filter:"all",page:0,pickerFilter:""};
    setView(el.dataset.tab);
  }
  else if(a==="home-logo"){ state.home={mode:"dashboard",setId:null,setName:"",section:"cards",filter:"all",page:0,pickerFilter:""}; setView("home"); window.scrollTo(0,0); }
  else if(a==="build-catalog"||a==="rebuild-catalog"){
    if(a==="rebuild-catalog"&&state.catalogMeta&&!confirm("Rebuild the card database? This re-downloads the full catalog.")) return;
    setView("home"); buildCatalog();
  }
  else if(a==="open-set") enterSet(el.dataset.sid,el.dataset.sn);
  else if(a==="open-filters") openFilters();
  else if(a==="open-search-sort") openSearchSort();
  else if(a==="srch-sort"){ state.search.filters.sort=el.dataset.val; refreshSearchSort(); }
  else if(a==="srch-sort-reset"){ state.search.filters.sort="best"; refreshSearchSort(); }
  else if(a==="flt-sort"){ state.search.filters.sort=el.dataset.val; refreshFilters(); }
  else if(a==="flt-type"){ state.search.filters.type=el.dataset.val; refreshFilters(); }
  else if(a==="flt-lang"){ state.search.filters.lang=el.dataset.val; refreshFilters(); }
  else if(a==="flt-toggle-rarity"){ state.search.flUI.rarityOpen=!state.search.flUI.rarityOpen; refreshFilters(); }
  else if(a==="flt-toggle-set"){ state.search.flUI.setOpen=!state.search.flUI.setOpen; refreshFilters(); }
  else if(a==="flt-rarity"){ toggleArr(state.search.filters.rarity,el.dataset.val); refreshFilters(); }
  else if(a==="flt-set"){ toggleArr(state.search.filters.set,el.dataset.val); refreshFilters(); }
  else if(a==="flt-reset"){ state.search.filters={sort:"best",type:"all",lang:"all",rarity:[],set:[]}; refreshFilters(); }
  else if(a==="wl-open-folder"){ state.wl.folder=el.dataset.fid; state.wlflt.rarityOpen=state.wlflt.setOpen=false; renderWishlist(); window.scrollTo(0,0); }
  else if(a==="wl-back"){ state.wl.folder=null; renderWishlist(); window.scrollTo(0,0); }
  else if(a==="wl-new-folder"){ const n=prompt("New folder name"); if(n&&n.trim()){ addFolder(n); renderWishlist(); } }
  else if(a==="wl-folder-menu") openWlFolderMenu(el.dataset.fid);
  else if(a==="wl-rename-folder"){ const f=wlFolder(el.dataset.fid); const n=prompt("Rename folder",f?f.name:""); if(n&&n.trim()) renameFolder(el.dataset.fid,n); if(state.modalMode==="wlfolder") closeModal(); else renderWishlist(); }
  else if(a==="wl-delete-folder"){ if(confirm("Delete this folder? The cards stay on your wishlist.")){ deleteFolder(el.dataset.fid); state.wl.folder=null; if(state.modalMode==="wlfolder") closeModal(); else renderWishlist(); } }
  else if(a==="open-wl-sort") openWlSort();
  else if(a==="open-wl-filters") openWlFilters();
  else if(a==="wl-sort-set"){ state.wlflt.sort=el.dataset.val; refreshWlSort(); }
  else if(a==="wl-sort-reset"){ state.wlflt.sort="val-hi"; refreshWlSort(); }
  else if(a==="wl-flt-lang"){ state.wlflt.lang=el.dataset.val; refreshWlFilters(); }
  else if(a==="wl-flt-toggle-rarity"){ state.wlflt.rarityOpen=!state.wlflt.rarityOpen; refreshWlFilters(); }
  else if(a==="wl-flt-toggle-set"){ state.wlflt.setOpen=!state.wlflt.setOpen; refreshWlFilters(); }
  else if(a==="wl-flt-rarity"){ toggleArr(state.wlflt.rarity,el.dataset.val); refreshWlFilters(); }
  else if(a==="wl-flt-set"){ toggleArr(state.wlflt.set,el.dataset.val); refreshWlFilters(); }
  else if(a==="wl-filters-reset"){ state.wlflt.lang="all"; state.wlflt.rarity=[]; state.wlflt.set=[]; refreshWlFilters(); }
  else if(a==="wl-card-folders") openCardFolders(el.dataset.pid);
  else if(a==="wl-toggle-card-folder"){ toggleCardFolder(state.fldPid,el.dataset.fid); refreshModal(); }
  else if(a==="wl-new-folder-card"){ const n=prompt("New folder name"); if(n&&n.trim()){ const f=addFolder(n); if(f) toggleCardFolder(state.fldPid,f.id); refreshModal(); } }
  else if(a==="back-home"){ state.home={mode:"dashboard",setId:null,setName:"",section:"cards",filter:"all",page:0,pickerFilter:""}; renderHome(); }
  else if(a==="set-back"){
    // return to whichever list the set was opened from (set list or dashboard)
    const from=state.home.from;
    const mode=(from==="picker"||from==="mysets")?from:"dashboard";
    state.home={mode:mode,setId:null,setName:"",section:"cards",filter:"all",page:0,pickerFilter:""};
    renderHome(); window.scrollTo(0,0);
  }
  else if(a==="pick-sets"){ state.home.mode="picker"; state.home.pickerFilter=""; renderHome(); }
  else if(a==="view-mysets"){ state.home.mode="mysets"; renderHome(); }
  else if(a==="toggle-fav"){
    toggleFav(el.dataset.sid);
    renderHome();
    toast(isFav(el.dataset.sid)?"Pinned to dashboard":"Unpinned");
  }
  else if(a==="set-sort"){ state.prefs.setSort=el.dataset.s; savePrefs(); renderHome(); }
  else if(a==="toggle-track"){
    toggleTracked(el.dataset.sid);
    renderHome();
    toast(isTracked(el.dataset.sid)?"Set added to your sets":"Set removed");
  }
  else if(a==="set-section"){ state.home.section=el.dataset.section; renderHome(); }
  else if(a==="set-filter"){ state.home.filter=el.dataset.filter; state.home.page=0; renderHome(); }
  else if(a==="toggle-set-star"){
    toggleSetStar(el.dataset.sid);
    renderHome();
    toast(isTracked(el.dataset.sid)?"Tracking this set — added to your dashboard":"Removed from your sets");
  }
  else if(a==="set-rarity-toggle"){ state.home.rarityOpen=!state.home.rarityOpen; renderHome(); }
  else if(a==="set-rarity-pick"){ state.home.rarity=el.dataset.val; state.home.rarityOpen=false; state.home.page=0; renderHome(); }
  else if(a==="view-mode"){ state.prefs.binder=el.dataset.v==="binder"; state.home.page=0; savePrefs(); renderHome(); }
  else if(a==="view-cols"){ state.prefs.cols=el.dataset.c==="4"?4:3; state.home.page=0; savePrefs(); renderHome(); }
  else if(a==="page-first"){ state.home.page=0; renderHome(); window.scrollTo(0,0); }
  else if(a==="page-prev"){ state.home.page=Math.max(0,state.home.page-1); renderHome(); window.scrollTo(0,0); }
  else if(a==="page-next"){ state.home.page=state.home.page+1; renderHome(); window.scrollTo(0,0); }
  else if(a==="page-last"){ state.home.page=1e9; renderHome(); window.scrollTo(0,0); }
  else if(a==="col-section"){ state.col=el.dataset.section; state.colflt.page=0; renderCollection(); }
  else if(a==="open-col-sort") openColSort();
  else if(a==="open-col-filters") openColFilters();
  else if(a==="col-sort-set"){ state.colflt.sort=el.dataset.val; state.colflt.page=0; refreshColSort(); }
  else if(a==="col-sort-reset"){ state.colflt.sort="val-hi"; state.colflt.page=0; refreshColSort(); }
  else if(a==="col-flt-toggle-rarity"){ state.colflt.rarityOpen=!state.colflt.rarityOpen; refreshColFilters(); }
  else if(a==="col-flt-toggle-set"){ state.colflt.setOpen=!state.colflt.setOpen; refreshColFilters(); }
  else if(a==="col-flt-rarity"){ toggleArr(state.colflt.rarity,el.dataset.val); state.colflt.page=0; refreshColFilters(); }
  else if(a==="col-flt-set"){ toggleArr(state.colflt.set,el.dataset.val); state.colflt.page=0; refreshColFilters(); }
  else if(a==="col-flt-lang"){ state.colflt.lang=el.dataset.val; state.colflt.page=0; refreshColFilters(); }
  else if(a==="col-filters-reset"){ state.colflt.rarity=[]; state.colflt.set=[]; state.colflt.lang="all"; state.colflt.page=0; refreshColFilters(); }
  else if(a==="col-per-page"){ state.prefs.colPerPage=+el.dataset.val; savePrefs(); state.colflt.page=0; refreshColFilters(); }
  else if(a==="col-page"){
    const p=el.dataset.p;
    if(p==="first") state.colflt.page=0;
    else if(p==="prev") state.colflt.page=Math.max(0,state.colflt.page-1);
    else if(p==="next") state.colflt.page=state.colflt.page+1;
    else if(p==="last") state.colflt.page=1e9;
    renderCollection(); window.scrollTo(0,0);
  }
  else if(a==="open-product") openProduct(pid);
  else if(a==="open-group") openGroup(el.dataset.sid,el.dataset.gname);
  else if(a==="quick-toggle") quickToggle(pid);
  else if(a==="quick-toggle-group") quickToggleGroup(el.dataset.sid,el.dataset.gname);
  else if(a==="own-inc"||a==="own-dec"){
    setQty(pid,v,getQty(pid,v)+(a==="own-inc"?1:-1));
    if($("#modal").classList.contains("open")) refreshModal(); else renderActive();
  }
  else if(a==="own-toggle"){
    setQty(pid,v,getQty(pid,v)>0?0:1);
    if($("#modal").classList.contains("open")) refreshModal(); else renderActive();
  }
  else if(a==="toggle-wishlist"){
    toggleWish(pid);
    if($("#modal").classList.contains("open")) refreshModal(); else renderActive();
    toast(isWished(pid)?"Added to wishlist":"Removed from wishlist");
  }
  else if(a==="zoom") openZoom(el.dataset.img);
  else if(a==="close-modal") closeModal();
  else if(a==="reload-news"){ state.news=null; state.newsLoading=false; loadNews(); }
  else if(a==="refresh-values") refreshValues();
  else if(a==="export") exportData();
  else if(a==="import") $("#importFile").click();
  else if(a==="clear-collection") clearCollection();
  else if(a==="clear-wishlist") clearWishlist();
  else if(a==="connect-sync") connectSync();
  else if(a==="disconnect-sync") disconnectSync();
  else if(a==="sync-now") initSync();
});
$("#importFile").addEventListener("change",e=>{
  if(e.target.files&&e.target.files[0]) handleImport(e.target.files[0]);
  e.target.value="";
});
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });
$("#zoom").addEventListener("click",closeZoom);

function applyTheme(){
  document.documentElement.classList.remove("dark");
}

/* ---------- installable-app niceties ---------- */
function installAppMeta(){
  let icon=null;
  try{
    const c=document.createElement("canvas"); c.width=c.height=512;
    const x=c.getContext("2d"),r=256;
    x.fillStyle="#fbfbfb"; x.beginPath(); x.arc(r,r,r,0,7); x.fill();
    x.fillStyle="#cd5e69"; x.beginPath(); x.arc(r,r,r,Math.PI,0); x.fill();
    x.fillStyle="#f1f1f1"; x.beginPath(); x.arc(r,r,r,0,Math.PI); x.fill();
    x.fillStyle="#434a54"; x.fillRect(0,r-33,512,66);
    x.beginPath(); x.arc(r,r,92,0,7); x.fill();
    x.fillStyle="#f1f1f1"; x.beginPath(); x.arc(r,r,59,0,7); x.fill();
    icon=c.toDataURL("image/png");
  }catch(e){}
  if(icon){ const l=document.createElement("link"); l.rel="apple-touch-icon"; l.href=icon; document.head.appendChild(l); }
  try{
    const m={name:"PokéVault",short_name:"PokéVault",display:"standalone",
      background_color:"#f1f1f1",theme_color:"#cd5e69",start_url:location.href,
      icons:icon?[{src:icon,sizes:"512x512",type:"image/png"}]:[]};
    const link=document.createElement("link");
    link.rel="manifest";
    link.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/json"}));
    document.head.appendChild(link);
  }catch(e){}
}

/* ---------- init ---------- */
async function init(){
  load();
  applyTheme();
  installAppMeta();
  renderHome();
  if(state.catalogMeta){
    try{
      const c=await idbGetAll();
      if(c&&c.length){ state.catalog=c; indexCatalog(); }
      else{ state.catalogMeta=null; try{localStorage.removeItem(LS_META);}catch(e){} }
    }catch(e){ state.catalogMeta=null; }
    renderActive();
    // fetch set release dates if we don't have them yet (powers recency sort)
    if(state.catalog.length) loadSetDates().then(()=>{
      if(state.tab==="search"||state.tab==="collection") renderActive();
    });
  }
  logSnapshot();
  initSync();
}
init();
</script>
