<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#cd5e69">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PokéVault">
<title>PokéVault — Card Collection Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Ccircle cx='18' cy='18' r='18' fill='%23FBFBFB'/%3E%3Cpath d='M18 3C26.2843 3 33 9.71573 33 18H3C3 9.71573 9.71573 3 18 3Z' fill='%23CD5E69'/%3E%3Cpath d='M18 33C9.71573 33 3 26.2843 3 18L33 18C33 26.2843 26.2843 33 18 33Z' fill='%23F1F1F1'/%3E%3Cpath d='M32.8672 16C32.9544 16.6543 33 17.3219 33 18C33 18.6781 32.9544 19.3457 32.8672 20H3.13281C3.04563 19.3457 3 18.6781 3 18C3 17.3219 3.04563 16.6543 3.13281 16H32.8672Z' fill='%23434A54'/%3E%3Ccircle cx='18' cy='18' r='5' fill='%23434A54'/%3E%3Ccircle cx='18' cy='18' r='3' fill='%23F1F1F1'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f1f1f1;--surface:#fbfbfb;--text:#515151;--muted:#a2a2a2;
    --primary:#cd5e69;--primary-dark:#b34f59;--border:#e3e3e3;
    --pos:#7dad8f;--neg:#d0555f;--gold:#f0b94a;--soft:#e8e8e8;
    --imgbg:#ededed;--okbg:#f1f7f2;--okborder:#cfe3d3;--oktext:#557e63;--info:#7b8a9c;
    --radius:8px;color-scheme:light;
  }
  html,body{height:100%;background:var(--bg)}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
  img{display:block;max-width:100%}
  button,input,select{font-family:inherit;font-size:16px;color:inherit}
  button{cursor:pointer}
  a{color:var(--primary)}

  .app-header{position:sticky;top:0;z-index:30;
    background:#cd5e69;color:#e6e9ed;
    padding:calc(env(safe-area-inset-top) + 10px) 15px 10px;
    display:flex;align-items:center;gap:11px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .app-header .logo{width:30px;height:30px;flex:none}
  .logobtn{flex:none;background:none;border:none;padding:0;display:flex;
    cursor:pointer;-webkit-tap-highlight-color:transparent}
  .logobtn:active{opacity:.7}
  .app-header h1{font-size:17px;font-weight:700;line-height:1}
  .app-header .tagline{font-size:10.5px;opacity:.92;font-weight:600;margin-top:3px}

  main{max-width:1100px;margin:0 auto;padding:15px 15px 92px}
  .view{display:none}.view.active{display:block}
  h2.section{font-size:15px;font-weight:700;margin:40px 0 10px;color:var(--primary);padding-left:20px}
  h2.section:first-child{margin-top:6px}
  .muted{color:var(--muted)}

  .btn{background:var(--primary);color:#fbfbfb;border:none;border-radius:8px;
    padding:12px 16px;font-weight:700}
  .btn:active{background:var(--primary-dark)}
  .btn:disabled{opacity:.5}
  .btn.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
  .btn.danger{background:#fbfbfb;color:var(--neg);border:1px solid #e9c4c7}
  .btn.block{width:100%}
  .btn.sm{padding:8px 13px;font-size:13px;border-radius:8px}

  .search-bar{margin-bottom:13px}
  .search-bar input{width:100%;padding:12px 14px;border:1px solid var(--border);
    border-radius:8px;background:var(--surface);outline:none}
  .search-bar input:focus{border-color:var(--primary)}

  .segment{display:flex;background:var(--soft);border-radius:8px;padding:3px;margin-bottom:14px}
  .segment button{flex:1;border:none;background:none;padding:9px 4px;border-radius:9px;
    font-weight:700;font-size:13px;color:var(--muted)}
  .segment button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.13)}

  .chips{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
  .chips button{border:1px solid var(--border);background:var(--surface);color:var(--muted);
    border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700}
  .chips button.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  .rowhead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 11px}
  .rowhead:first-child{margin-top:4px}
  .rowhead h2{font-size:15px;font-weight:700;color:var(--primary);padding-left:20px}

  .set-row{display:flex;align-items:center;gap:20px;background:var(--surface);
    border:1px solid var(--border);border-radius:8px;padding:12px 20px 12px 10px;margin-bottom:10px;
    cursor:pointer;-webkit-tap-highlight-color:transparent}
  .set-row:active{border-color:var(--primary)}
  .set-row.tracked{border-color:#bcd6c4;background:var(--okbg)}
  .set-row .si{flex:1;min-width:0}
  .set-row .sn{font-weight:700;font-size:13.5px}
  .set-row .smeta{font-size:11px;color:var(--muted);margin-top:3px}
  .set-row .sval{font-weight:700;font-size:13.5px;flex:none;text-align:right}
  .set-row .sval span{display:block;font-size:10px;color:var(--muted);font-weight:600}
  .minibar{height:4px;background:#d9d9d9;border-radius:10px;overflow:hidden;margin-top:7px}
  .minibar>div{height:100%;background:var(--pos);border-radius:10px}
  .track-btn{flex:none;border:1.5px solid var(--border);border-radius:999px;
    padding:6px 14px;font-size:12px;font-weight:700;color:var(--muted)}
  .track-btn.on{background:var(--pos);color:#fff;border-color:var(--pos)}
  .starbtn{flex:none;width:24px;height:36px;border:none;background:none;padding:0;
    color:#cdd0d6;display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent}
  .starbtn svg{width:22px;height:22px;fill:currentColor}
  .starbtn.on{color:var(--gold)}

  .progress{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:12px 0 8px}
  .progress>div{height:100%;background:var(--pos);transition:width .3s}

  .hero{background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:20px 20px;margin-bottom:10px}
  .hero .label{font-size:15px;font-weight:700;color:var(--primary)}
  .hero .value{font-size:33.7px;font-weight:900;color:var(--text);line-height:1.05;margin-top:6px}
  .hero .sub{font-size:13px;color:var(--muted);font-weight:700;margin-top:10px}
  .hero .trend{font-size:12px;font-weight:700;margin-top:10px;
    display:inline-block;padding:3px 9px;border-radius:6px;background:var(--soft)}
  .hero .trend.up{color:var(--pos)}.hero .trend.down{color:var(--neg)}

  .card-box{background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:13px 14px;margin-bottom:10px}
  .mover{display:flex;justify-content:space-between;align-items:center;
    padding:7px 0;border-bottom:1px solid var(--border)}
  .mover:last-child{border-bottom:none}
  .mover .mn{font-size:13px;font-weight:700}
  .mover .ms{font-size:11px;color:var(--muted)}
  .mover .md{font-size:13px;font-weight:700}

  .comp{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 15px;margin-bottom:13px}
  .comp .ctop{display:flex;justify-content:space-between;align-items:flex-end}
  .comp .cpct{font-size:26px;font-weight:700;line-height:1}
  .comp .cval{font-size:13px;font-weight:700;color:var(--pos);text-align:right}
  .comp .cval span{display:block;font-size:10px;color:var(--muted);font-weight:600}
  .comp .cbar{height:9px;background:var(--soft);border-radius:5px;overflow:hidden;margin-top:9px}
  .comp .cbar>div{height:100%;background:var(--pos);border-radius:5px}

  .hscroll{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:4px;margin-bottom:4px}
  .newset{flex:none;width:115px;min-height:65px;display:flex;align-items:center;
    background:var(--surface);border:1px solid var(--border);
    border-radius:8px;padding:10px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .newset:active{border-color:var(--primary)}
  .newset .nn{font-weight:700;font-size:13.5px;line-height:1.3;color:var(--text);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

  .topcard{display:flex;align-items:center;gap:20px;background:var(--surface);
    border:1px solid var(--border);border-radius:8px;padding:9px 20px 9px 10px;margin-bottom:10px;
    cursor:pointer;-webkit-tap-highlight-color:transparent}
  .topcard:active{border-color:var(--primary)}
  .topcard .tcimg{width:44px;height:62px;flex:none;object-fit:contain;
    background:var(--imgbg);border-radius:3px}
  .topcard .tcinfo{flex:1;min-width:0}
  .topcard .tcnm{font-size:13.5px;font-weight:700;color:var(--text);line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .topcard .tcset{font-size:11px;font-weight:500;color:var(--muted);margin-top:4px}
  .topcard .tcval{font-size:13.5px;font-weight:700;color:var(--text);flex:none}
  .dashhint{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:10px}
  .viewall{display:block;width:100%;background:var(--primary);color:#fbfbfb;border:none;
    border-radius:8px;padding:7px 16px;font-weight:700;font-size:15px;margin-bottom:10px}
  .viewall:active{background:var(--primary-dark)}

  .news a{display:block;text-decoration:none;color:var(--text);
    padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;font-weight:600;line-height:1.4}
  .news a:last-child{border-bottom:none}
  .news a:active{color:var(--primary)}

  .viewtoggle{display:flex;gap:7px;align-items:center;margin-bottom:11px;flex-wrap:wrap}
  .viewtoggle .seg{display:flex;background:var(--soft);border-radius:9px;padding:3px}
  .viewtoggle .seg button{border:none;background:none;padding:6px 11px;border-radius:7px;
    font-size:12.5px;font-weight:700;color:var(--muted)}
  .viewtoggle .seg button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .binder{display:grid;gap:8px}
  .binder.c3{grid-template-columns:repeat(3,1fr)}
  .binder.c4{grid-template-columns:repeat(4,1fr)}
  .pagenav{display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 0 6px}
  .pagenav button{border:1px solid var(--border);background:var(--surface);border-radius:4px;
    width:36px;height:34px;display:flex;align-items:center;justify-content:center;padding:0;
    color:var(--text);-webkit-tap-highlight-color:transparent}
  .pagenav button:disabled{opacity:.3}
  .pagenav button svg{display:block}
  .pagenav .pgdbl svg{width:17px;height:12px}
  .pagenav .pgcaret svg{width:16px;height:16px}
  .pagenav .pgprev svg{transform:rotate(90deg)}
  .pagenav .pgnext svg{transform:rotate(-90deg)}
  .pagenav .flip svg{transform:scaleX(-1)}
  .pagenav .pg{font-size:15px;font-weight:700;color:var(--text);min-width:96px;text-align:center}

  /* ---- set detail ---- */
  .setdhd{display:flex;align-items:center;gap:4px;margin:6px 0 14px}
  .setdhd .setdttl{font-size:15px;font-weight:700;color:var(--primary);min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .setprog{background:var(--surface);border:1px solid var(--border);border-radius:8px;
    padding:18px 20px;margin-bottom:14px}
  .setprog .sphead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .setprog .splabel{font-size:15px;font-weight:700;color:var(--primary)}
  .setprog .sppct{font-size:33.7px;font-weight:900;color:var(--text);line-height:1.05;margin-top:5px}
  .setprog .spcount{font-size:13px;font-weight:700;color:var(--muted);margin-top:8px}
  .setprog .spval{text-align:right;flex:none}
  .setprog .spval .v{font-size:15px;font-weight:700;color:var(--pos)}
  .setprog .spval .l{font-size:13px;font-weight:700;color:var(--muted);margin-top:3px}
  .setprog .spbar{height:8px;background:#d9d9d9;border-radius:19px;overflow:hidden;margin-top:14px}
  .setprog .spbar>div{height:100%;background:var(--pos);border-radius:19px}
  .rfilter{margin-bottom:13px}
  .setfltrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px}
  .setpills{display:flex;gap:8px;flex-wrap:wrap}
  .setpills button{border:1px solid var(--border);background:var(--surface);color:#919191;
    font-size:13px;font-weight:700;border-radius:100px;padding:8px 17px;
    -webkit-tap-highlight-color:transparent}
  .setpills button.active{background:var(--primary);color:#fbfbfb;border-color:var(--primary)}
  .lbtoggle{display:flex;flex:none}
  .lbtoggle button{width:64px;height:40px;border:1px solid #d8d7d7;background:var(--soft);
    color:var(--muted);font-size:13.5px;font-weight:700;-webkit-tap-highlight-color:transparent}
  .lbtoggle button:first-child{border-radius:8px 0 0 8px}
  .lbtoggle button:last-child{border-radius:0 8px 8px 0;border-left:none}
  .lbtoggle button.active{background:var(--surface);border-color:var(--border);color:var(--text)}
  .setrow{display:flex;align-items:center;gap:12px;background:var(--surface);
    border:1px solid var(--border);border-radius:8px;padding:9px 14px 9px 10px;margin-bottom:10px}
  .setrow .srtap{display:flex;align-items:center;gap:20px;flex:1;min-width:0;
    cursor:pointer;-webkit-tap-highlight-color:transparent}
  .setrow .srthumb{width:44px;height:62px;flex:none;background:var(--imgbg);
    border-radius:3px;object-fit:contain}
  .setrow .srmeta{flex:1;min-width:0}
  .setrow .srnm{font-size:13.51px;font-weight:700;color:var(--text);line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .setrow .srnum{font-size:11px;font-weight:500;color:var(--muted);margin-top:6px}
  .setrow .srtogs{display:flex;gap:9px;flex:none}
  .vtog{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;
    border:none;padding:0;-webkit-tap-highlight-color:transparent}
  .vtog .vtcirc,.vtog .vtcirc svg{width:30px;height:30px;display:block}
  .vtog .vtlbl{font-size:8px;font-weight:700;color:var(--muted);white-space:nowrap}
  .vtog.on .vtlbl{color:var(--pos)}
  .btile{background:var(--surface);border:1px solid var(--border);border-radius:6px;
    overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .btile .btimg{position:relative;aspect-ratio:.717;background:var(--imgbg)}
  .btile .btimg img{width:100%;height:100%;object-fit:contain}
  .btile .btbadges{position:absolute;right:4px;bottom:4px;display:flex;gap:2px}
  .btile .bt-b,.btile .bt-b svg{width:13px;height:13px;display:block}
  .btile .btinfo{padding:5px 7px;border-top:1px solid var(--border)}
  .btile .btnm{font-size:9px;font-weight:700;color:var(--text);line-height:1.2;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btile .btnum{font-size:7.5px;font-weight:500;color:var(--muted);margin-top:2px}
  .raritysel{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:8px;
    background:var(--surface);font-size:13px;font-weight:600;margin-bottom:11px;outline:none}
  .raritysel:focus{border-color:var(--primary)}
  .syncf{margin-bottom:11px}
  .syncf label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--muted)}
  .syncf input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;
    background:var(--surface);outline:none;color:inherit}
  .syncf input:focus{border-color:var(--primary)}
  .sqlbox{background:var(--soft);border:1px solid var(--border);border-radius:9px;padding:10px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;line-height:1.5;
    overflow-x:auto;white-space:pre;margin-top:8px}
  .synchint{margin-top:8px}
  .synchint summary{font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
  .synchint ol{font-size:12px;color:var(--muted);line-height:1.65;padding-left:18px;margin:8px 0 0}

  .tile{position:relative;background:var(--surface);border:1px solid var(--border);
    border-radius:5px;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .tile.owned{border-color:#7dad8f;box-shadow:0 0 0 1px #7dad8f inset}
  .tile.partial{border-color:#f5e09f;box-shadow:0 0 0 1px #f5e09f inset}
  .tile .imgwrap{position:relative;aspect-ratio:.717;background:var(--imgbg);
    display:flex;align-items:center;justify-content:center}
  .tile .imgwrap img{width:100%;height:100%;object-fit:contain;transition:filter .15s}
  .tile.unowned .imgwrap img{filter:grayscale(100%);opacity:.48}
  .tile .ph{font-size:10px;color:#9aa0aa;font-weight:600}
  .qbtn{position:absolute;top:5px;right:5px;width:24px;height:24px;
    border:2px solid #fff;border-radius:50%;background:#fff;padding:0;
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .qbtn svg{width:20px;height:20px;display:block}
  .cntbadge{position:absolute;left:5px;bottom:5px;background:var(--primary);color:#fff;
    font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px}
  .tile .info{padding:7px 8px;border-top:1px solid var(--border)}
  .tile .nm{font-size:10.5px;font-weight:700;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:26px}
  .tile .pr{font-size:10.5px;font-weight:700;color:var(--primary);margin-top:3px}
  .tile .vers{font-size:11px;font-weight:700;color:var(--muted);margin-top:3px}
  .tile .tag{position:absolute;left:5px;top:5px;background:#3a3f4a;color:#fff;
    font-size:9px;font-weight:700;border-radius:5px;padding:1px 5px;letter-spacing:.3px}
  .tile .tag.grp{background:#5a3fa8}
  .tile .tag.jp{background:#cd5e69}

  .searchhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 10px}
  .searchhead .rcount{font-size:11px;font-weight:700;color:var(--text)}
  .filterbtn{background:var(--primary);color:#fbfbfb;border:none;border-radius:6px;
    padding:7px 18px;font-size:13px;font-weight:700;flex:none}
  .filterbtn:active{background:var(--primary-dark)}
  .searchhint{text-align:center;padding:46px 24px 0;color:var(--text)}
  .searchhint svg{width:38px;height:38px;stroke:var(--primary);fill:none;
    stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:16px}
  .searchhint p{font-size:11px;font-weight:500;line-height:1.75}
  .searchhint b{font-weight:700}
  .filterhead{font-size:17px;font-weight:700;color:var(--text);margin:2px 0 4px}
  .fsec{font-size:13px;font-weight:700;color:var(--primary);margin:16px 0 8px}
  .fdrop{display:flex;align-items:center;justify-content:space-between;width:100%;
    border:1px solid var(--border);background:var(--surface);border-radius:8px;
    padding:10px 11px;font-size:13px;font-weight:600;color:var(--text);
    -webkit-tap-highlight-color:transparent}
  .fdrop svg{width:22px;height:22px;flex:none;transition:transform .15s}
  .fdrop.open svg{transform:rotate(180deg)}
  .fdroplist{border:1px solid var(--border);border-radius:8px;margin-top:6px;
    overflow:hidden;background:var(--surface)}
  .fdropsearch{padding:8px;border-bottom:1px solid var(--border)}
  .fdropsearch input{width:100%;border:1px solid var(--border);border-radius:6px;
    padding:8px 10px;background:var(--bg);outline:none;color:inherit}
  .fdropsearch input:focus{border-color:var(--primary)}
  .fdropopts{max-height:220px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .fopt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:none;border:none;border-top:1px solid var(--border);
    padding:10px 12px;font-size:13px;font-weight:600;color:var(--text);
    -webkit-tap-highlight-color:transparent}
  .fdropopts .fopt:first-child{border-top:none}
  .fopt .foptcheck{width:18px;height:18px;border:1.7px solid var(--border);
    border-radius:5px;flex:none;position:relative}
  .fopt.on .foptcheck{background:var(--primary);border-color:var(--primary)}
  .fopt.on .foptcheck::after{content:"";position:absolute;left:5px;top:1.5px;
    width:4px;height:8px;border:solid #fbfbfb;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .fopt .foptlbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fopt.on{color:var(--primary)}
  .fopt-empty{padding:14px;font-size:12.5px;color:var(--muted);text-align:center}
  .cardtoggle{display:flex;gap:10px;margin-bottom:13px}
  .cardtoggle button{flex:1;height:40px;border-radius:8px;font-size:13.5px;font-weight:700;
    border:1px solid #d8d7d7;background:#e8e8e8;color:var(--muted);
    -webkit-tap-highlight-color:transparent}
  .cardtoggle button.active{border-color:var(--border);background:var(--surface);color:var(--text)}
  .colhd{font-size:15px;font-weight:700;color:var(--primary);padding-left:20px}
  .sortbtn{width:30px;height:30px;border:1px solid var(--border);background:var(--surface);
    border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none;
    color:var(--text);-webkit-tap-highlight-color:transparent}
  .sortbtn svg{width:18px;height:18px}
  .fsheet-title{font-size:20px;font-weight:700;color:var(--primary);margin:2px 0 6px}
  .tcvar{font-size:11px;font-weight:500;color:var(--primary);margin-top:4px}
  .heartbtn{background:none;border:none;padding:0;flex:none;width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
  .heartbtn svg{width:22px;height:22px;display:block}
  .pdname{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:4px}
  /* ---- Wishlist ---- */
  .wltop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 13px}
  .wltop h2.section{margin:0}
  .newfolderbtn{background:var(--primary);color:#fbfbfb;border:none;border-radius:4px;
    padding:8px 15px;font-size:13px;font-weight:700;flex:none;-webkit-tap-highlight-color:transparent}
  .newfolderbtn:active{background:var(--primary-dark)}
  .foldercard{flex:none;width:115px;height:65px;background:var(--surface);
    border:1px solid var(--border);border-radius:8px;padding:10px;text-align:left;
    display:flex;flex-direction:column;justify-content:center;gap:4px;
    -webkit-tap-highlight-color:transparent}
  .foldercard:active{border-color:var(--primary)}
  .foldercard .fcname{font-size:13.5px;font-weight:700;color:var(--text);line-height:1.2;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .foldercard .fccount{font-size:11px;font-weight:500;color:var(--muted)}
  .hdacts{display:flex;align-items:center;gap:10px;flex:none}
  .folderttl{display:flex;align-items:center;gap:3px;min-width:0}
  .folderttl .foldername{font-size:15px;font-weight:700;color:var(--primary);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .wlback{background:none;border:none;padding:0 3px 0 0;color:var(--primary);
    font-size:23px;font-weight:700;line-height:1;flex:none;-webkit-tap-highlight-color:transparent}
  .foldermenu{background:none;border:none;padding:0;width:24px;height:24px;flex:none;
    color:var(--muted);display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent}
  .foldermenu svg{width:18px;height:18px}
  .wlrow .heart{margin-left:-10px}
  .heartbtn.foldericon{color:var(--muted)}
  .heartbtn.infolders{color:var(--primary)}

  .srow{display:flex;align-items:center;gap:10px;background:var(--surface);
    border:1px solid var(--border);border-radius:8px;padding:9px 10px;margin-bottom:10px}
  .srow.owned{border-color:#9bd3ab}
  .srow .srimg{width:46px;height:46px;flex:none;background:var(--imgbg);border-radius:8px;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .srow .srimg img{width:100%;height:100%;object-fit:contain}
  .srow .srinfo{flex:1;min-width:0;cursor:pointer}
  .srow .srinfo .nm{font-weight:700;font-size:13px;line-height:1.25}
  .srow .srinfo .sub{font-size:11.5px;color:var(--muted);margin-top:2px}

  .stepper{display:flex;align-items:center;gap:8px;flex:none}
  .stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface);font-size:21px;font-weight:700;line-height:0;
    display:flex;align-items:center;justify-content:center;padding:0}
  .stepper button:active{background:var(--soft)}
  .stepper .q{min-width:26px;text-align:center;font-weight:700;font-size:16px}

  .item{display:flex;gap:11px;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;padding:10px;margin-bottom:10px;align-items:center;
    cursor:pointer;-webkit-tap-highlight-color:transparent}
  .item:active{border-color:var(--primary)}
  .item img{width:46px;height:64px;object-fit:contain;background:var(--imgbg);border-radius:6px;flex:none}
  .item .iph{width:46px;height:64px;background:var(--imgbg);border-radius:6px;flex:none}
  .item .meta{flex:1;min-width:0}
  .item .meta .nm{font-weight:700;font-size:14px;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item .meta .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .item .meta .vsum{font-size:11px;color:var(--info);font-weight:600;margin-top:3px}
  .item .vals{text-align:right;flex:none;display:flex;align-items:center;gap:9px}
  .item .vals .v{font-weight:700;font-size:14px}
  .heart{width:30px;height:30px;border:none;background:none;padding:0;color:#c9ccd2;flex:none}
  .heart svg{width:24px;height:24px;fill:currentColor}
  .heart.on{color:var(--primary)}

  .summary{background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:15px 16px;margin-bottom:13px}
  .summary .label{font-size:15px;color:var(--primary);font-weight:700}
  .summary .value{font-size:33.7px;font-weight:900;line-height:1.1;margin-top:6px}
  .summary .sub{font-size:13px;color:var(--muted);font-weight:700;margin-top:5px}

  .panel{background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:15px 16px;margin-bottom:13px}
  .panel h3{font-size:15px;font-weight:700;margin-bottom:6px}
  .panel p.hint{font-size:12.5px;color:var(--muted);line-height:1.55;margin-bottom:11px}
  .row2{display:flex;gap:9px}.row2>*{flex:1}

  .empty{text-align:center;padding:38px 22px;color:var(--muted)}
  .empty svg{width:48px;height:48px;opacity:.38;margin-bottom:11px}
  .empty p{font-size:14px;line-height:1.55}
  .status{text-align:center;padding:24px;color:var(--muted);font-size:13px}
  .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);
    border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 11px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .back-btn{display:inline-flex;align-items:center;gap:5px;background:none;border:none;
    color:var(--primary);font-weight:700;font-size:14px;padding:4px 0;margin-bottom:8px}

  .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);
    border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -2px 10px rgba(0,0,0,.05)}
  .bottom-nav button{flex:1;background:none;border:none;padding:10px 0 9px;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    color:#797979;font-size:10px;font-weight:700}
  .bottom-nav button.active{color:var(--primary)}
  .bottom-nav svg{width:23px;height:23px}
  .bottom-nav .ico-line{fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .bottom-nav .ico-fill{fill:currentColor;display:none}
  .bottom-nav button.active .ico-line{display:none}
  .bottom-nav button.active .ico-fill{display:block}

  .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);
    display:none;align-items:flex-end;justify-content:center}
  .modal.open{display:flex}
  .modal-card{background:var(--bg);width:100%;max-width:560px;max-height:93vh;
    overflow-y:auto;border-radius:20px 20px 0 0;
    padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);-webkit-overflow-scrolling:touch}
  @media(min-width:560px){.modal{align-items:center}.modal-card{border-radius:18px;max-height:90vh}}
  .modal-grip{width:50px;height:4px;background:#d9d9d9;border-radius:8px;margin:8px auto 14px}
  .panel-img{width:62%;max-width:240px;margin:2px auto 12px;border-radius:8px;overflow:hidden;
    background:var(--imgbg);cursor:zoom-in}
  .panel-img img{width:100%}
  .pdetail h2{font-size:17px;font-weight:700;line-height:1.25;text-align:center}
  .pdetail .sub{font-size:11px;color:var(--muted);font-weight:500;margin-top:7px;line-height:1.5;text-align:center}
  .wishrow{text-align:center;margin-top:10px}
  .wish-btn{display:inline-flex;align-items:center;gap:6px;
    border:1.5px solid var(--border);background:var(--surface);color:var(--muted);
    border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:700}
  .wish-btn svg{width:16px;height:16px;fill:currentColor}
  .wish-btn.on{border-color:var(--primary);color:var(--primary);background:rgba(205,94,105,.13)}
  .panel-sec{font-size:15px;font-weight:700;color:var(--primary);margin:18px 0 9px 20px}
  .vrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--surface);border:1px solid var(--border);border-radius:8px;
    padding:9px 10px 9px 20px;margin-bottom:10px}
  .vrow.has{border-color:#7dad8f;background:#dfeae3}
  .vrow.toggle{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .vrow.toggle:active{background:var(--soft)}
  .vrow .vn{font-weight:700;font-size:13.5px}
  .vrow .vp{font-size:11px;font-weight:500;color:var(--muted);margin-top:3px}
  .vcheck{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);flex:none;
    display:flex;align-items:center;justify-content:center;color:#fff}
  .vcheck svg{width:17px;height:17px}
  .vcheck.on{background:var(--pos);border-color:var(--pos)}
  .ptotal{background:#d9d9d9;border:1px solid #bababa;border-radius:6px;
    padding:7px 13px;font-size:13.5px;font-weight:700;margin:13px 0;text-align:center;color:var(--text)}
  .gprod{border:1px solid var(--border);border-radius:8px;padding:11px;
    margin-bottom:10px;background:var(--surface)}
  .gprod-head{display:flex;gap:11px;margin-bottom:9px}
  .gprod-img{width:58px;flex:none;border-radius:7px;overflow:hidden;background:var(--imgbg);
    align-self:flex-start;cursor:zoom-in}
  .gprod-img img{width:100%}
  .gprod-nm{font-weight:700;font-size:14px}

  .zoomwrap{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.93);display:none;
    align-items:center;justify-content:center;padding:24px}
  .zoomwrap.open{display:flex}
  .zoomwrap img{max-width:100%;max-height:100%;border-radius:9px}

  #toast{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 78px);z-index:95;
    background:#1f2430;color:#fff;padding:11px 18px;border-radius:8px;
    font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;
    pointer-events:none;max-width:90%;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}
  #toast.show{opacity:1}
  .hidden{display:none!important}
</style>
</head>

/* ---------- storage ---------- */
function pj(k){ try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;} }
function load(){
  state.owned=pj(LS_OWNED)||{};
  state.wishlist=pj(LS_WISH)||{};
  state.wishFolders=pj(LS_WFOLDERS)||[];
  state.tracked=pj(LS_TRACKED)||{};
  state.favorites=pj(LS_FAV)||{};
  state.flatPrices=pj(LS_PRICES)||{};
  state.setDates=pj(LS_SETDATES)||{};
  state.history=pj(LS_HISTORY)||[];
  state.catalogMeta=pj(LS_META);
  const pf=pj(LS_PREFS);
  if(pf&&typeof pf==="object"){
    state.prefs.binder=pf.binder!==false;
    state.prefs.cols=(pf.cols===3?3:4);
    state.prefs.setSort=(["az","new","old"].indexOf(pf.setSort)>-1?pf.setSort:"az");
    state.prefs.colRarity=(typeof pf.colRarity==="string"?pf.colRarity:"");
    state.prefs.colPerPage=([10,20,30,50,100].indexOf(pf.colPerPage)>-1?pf.colPerPage:30);
    state.prefs.theme=(pf.theme==="dark"?"dark":"light");
  }
  const sc=pj(LS_SYNC);
  if(sc&&typeof sc==="object") state.sync={url:sc.url||"",key:sc.key||"",pass:sc.pass||""};
  state.dirty=localStorage.getItem(LS_DIRTY)==="1";
  for(const k of ["owned","wishlist","tracked","favorites"]) if(!state[k]||typeof state[k]!=="object") state[k]={};
  if(!Array.isArray(state.history)) state.history=[];
  state.wishFolders=normFolders(state.wishFolders);
  if(!Object.keys(state.owned).length){
    const old=pj("pv2_collection");
    if(Array.isArray(old)&&old.length){
      for(const it of old){
        if(!it||it.productId==null) continue;
        const pid=String(it.productId),v=it.variant||"Default",q=Math.max(1,it.qty|0||1);
        state.owned[pid]=state.owned[pid]||{};
        state.owned[pid][v]=(state.owned[pid][v]||0)+q;
        if(it.marketPrice!=null){
          state.flatPrices[pid]=state.flatPrices[pid]||{};
          if(state.flatPrices[pid][v]==null) state.flatPrices[pid][v]=it.marketPrice;
        }
      }
      saveOwned(); persistPrices();
    }
  }
}
function saveOwned(){ try{localStorage.setItem(LS_OWNED,JSON.stringify(state.owned));}catch(e){toast("Storage full — couldn’t save");} syncDirty(); }
function saveWish(){ try{localStorage.setItem(LS_WISH,JSON.stringify(state.wishlist));}catch(e){} syncDirty(); }
function saveTracked(){ try{localStorage.setItem(LS_TRACKED,JSON.stringify(state.tracked));}catch(e){} syncDirty(); }
function saveFav(){ try{localStorage.setItem(LS_FAV,JSON.stringify(state.favorites));}catch(e){} syncDirty(); }
function saveWishFolders(){ try{localStorage.setItem(LS_WFOLDERS,JSON.stringify(state.wishFolders));}catch(e){} syncDirty(); }
function normFolders(arr){
  if(!Array.isArray(arr)) return [];
  return arr.filter(f=>f&&typeof f==="object").map(f=>({
    id:String(f.id||genId()),
    name:String(f.name||"Folder"),
    items:(f.items&&typeof f.items==="object"&&!Array.isArray(f.items))?f.items:{}
  }));
}
function savePrefs(){ try{localStorage.setItem(LS_PREFS,JSON.stringify(state.prefs));}catch(e){} }
function saveSetDates(){ try{localStorage.setItem(LS_SETDATES,JSON.stringify(state.setDates));}catch(e){} }
/* release date (YYYY-MM-DD) of the set a card belongs to; "" if unknown */
function setDate(sid){ return state.setDates[String(sid)]||""; }
/* fetch each set's published_on date — small, separate from the catalog,
   so the recency sort works without a full catalog rebuild */
async function loadSetDates(force){
  if(!force&&Object.keys(state.setDates).length) return;
  const map={};
  for(const c of [CAT,CAT_JP]){
    try{
      const r=await apiGet(`/${c}/sets`);
      for(const s of (r.sets||r.data||[])){
        const id=(s.id!=null?s.id:s.set_id);
        const d=s.published_on||s.release_date||s.released_on||"";
        if(id!=null&&d) map[String(id)]=String(d).slice(0,10);
      }
    }catch(e){}
  }
  if(Object.keys(map).length){
    state.setDates=Object.assign({},state.setDates,map);
    saveSetDates();
  }
}
function persistPrices(){
  const sub={};
  const ids=new Set([...Object.keys(state.owned),...Object.keys(state.wishlist)]);
  for(const pid of ids) if(state.flatPrices[pid]) sub[pid]=state.flatPrices[pid];
  try{localStorage.setItem(LS_PRICES,JSON.stringify(sub));}catch(e){}
}
function saveHistory(){
  try{ localStorage.setItem(LS_HISTORY,JSON.stringify(state.history)); }
  catch(e){
    try{ const h=state.history.map((e,i)=>i<state.history.length-6?{d:e.d,total:e.total}:e);
      localStorage.setItem(LS_HISTORY,JSON.stringify(h)); state.history=h; }catch(e2){}
  }
}

/* ---------- IndexedDB catalog ---------- */
function idbOpen(){return new Promise((res,rej)=>{
  const rq=indexedDB.open(IDB_NAME,1);
  rq.onupgradeneeded=()=>{const db=rq.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE,{keyPath:"i"});};
  rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error||new Error("idb"));
});}
async function idbPutAll(items){const db=await idbOpen();return new Promise((res,rej)=>{
  const tx=db.transaction(IDB_STORE,"readwrite"),st=tx.objectStore(IDB_STORE);
  for(const it of items) st.put(it);
  tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error||new Error("idb write"));
});}
async function idbGetAll(){const db=await idbOpen();return new Promise((res,rej)=>{
  const tx=db.transaction(IDB_STORE,"readonly"),rq=tx.objectStore(IDB_STORE).getAll();
  rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>rej(rq.error||new Error("idb read"));
});}
async function idbClear(){const db=await idbOpen();return new Promise((res,rej)=>{
  const tx=db.transaction(IDB_STORE,"readwrite");tx.objectStore(IDB_STORE).clear();
  tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error||new Error("idb clear"));
});}

/* ---------- API ---------- */
async function apiGet(path){
  let res;
  try{ res=await fetch(API+path); }catch(e){ throw new Error("Network error — you appear to be offline."); }
  if(!res.ok) throw new Error("API error ("+res.status+")");
  return res.json();
}

/* ---------- catalog indexing ---------- */
function looksSealed(name){ return SEALED_RE.test(name||""); }
function indexCatalog(){
  state.byId=new Map(); state.bySet=new Map();
  for(const c of state.catalog){
    c.sealed=looksSealed(c.n);
    state.byId.set(String(c.i),c);
    let g=state.bySet.get(c.sid);
    if(!g){ g={name:c.s||("Set "+c.sid),cat:c.cat||CAT,cards:[],sealed:[],groups:[]}; state.bySet.set(c.sid,g); }
    if(c.s&&!g.name) g.name=c.s;
    (c.sealed?g.sealed:g.cards).push(c);
  }
  // group cards by collector number (finish/pattern variants of the same card)
  for(const g of state.bySet.values()){
    const map=new Map();
    for(const c of g.cards){
      const num=String(c.nu||"").trim();
      const key=num?("#"+num):("solo:"+c.i);
      let grp=map.get(key);
      if(!grp){ grp={key,number:num,name:"",products:[]}; map.set(key,grp); g.groups.push(grp); }
      grp.products.push(c);
    }
    for(const grp of g.groups){
      let base=grp.products[0];
      for(const p of grp.products) if(String(p.n||"").length<String(base.n||"").length) base=p;
      grp.name=cleanName(base.n)||base.n||("Card "+(grp.number||""));
      // order printings: base card, then Energy, then Ball-pattern reverses
      grp.products.sort((a,b)=>patSort(a.n)-patSort(b.n));
    }
    g.groups.sort((a,b)=>cmpNum(a.number,b.number));
  }
}

async function buildCatalog(){
  if(state.building) return;
  state.building=true; state.build={done:0,total:0,cards:0,failed:0};
  renderHome();
  let sets=[]; const setDateMap={};
  const grabDate=(s,id)=>{ const d=s.published_on||s.release_date||s.released_on||""; if(d) setDateMap[String(id)]=String(d).slice(0,10); };
  try{
    const r=await apiGet(`/${CAT}/sets`);
    (r.sets||r.data||[]).forEach(s=>{ const id=(s.id!=null?s.id:s.set_id);
      if(id!=null){ sets.push({id,name:s.name||s.set_name||"",cat:CAT}); grabDate(s,id); } });
  }catch(e){ state.building=false; renderHome(); toast("Couldn’t reach the card database."); return; }
  if(!sets.length){ state.building=false; renderHome(); toast("No sets returned by the API."); return; }
  // Japanese sets (category 85) — best-effort; if it fails, build English only
  try{
    const r=await apiGet(`/${CAT_JP}/sets`);
    (r.sets||r.data||[]).forEach(s=>{ const id=(s.id!=null?s.id:s.set_id);
      if(id!=null){ sets.push({id,name:s.name||s.set_name||"",cat:CAT_JP}); grabDate(s,id); } });
  }catch(e){}
  state.build.total=sets.length;
  const all=[]; let cur=0;
  async function worker(){
    while(cur<sets.length){
      const set=sets[cur++];
      try{
        const r=await apiGet(`/${set.cat}/sets/${set.id}`);
        for(const p of (r.products||r.data||[])){
          if(p&&p.id!=null) all.push({
            i:p.id, n:p.name||p.clean_name||"Unknown", s:p.set_name||set.name||"",
            sid:set.id, nu:p.number||"", r:p.rarity||"", g:p.image_url||p.image||"", cat:set.cat
          });
        }
        state.build.cards=all.length;
      }catch(e){ state.build.failed++; }
      state.build.done++; renderBuildProgress();
    }
  }
  await Promise.all(Array.from({length:8},worker));
  if(!all.length){ state.building=false; renderHome(); toast("No card data downloaded."); return; }
  try{ await idbClear(); await idbPutAll(all); }
  catch(e){ state.building=false; renderHome(); toast("Couldn’t save the catalog to storage."); return; }
  state.catalog=all;
  state.catalogMeta={count:all.length,builtAt:Date.now()};
  try{localStorage.setItem(LS_META,JSON.stringify(state.catalogMeta));}catch(e){}
  if(Object.keys(setDateMap).length){ state.setDates=Object.assign({},state.setDates,setDateMap); saveSetDates(); }
  indexCatalog();
  state.building=false;
  state.home={mode:"dashboard",setId:null,setName:"",section:"cards",filter:"all",page:0,pickerFilter:""};
  renderHome();
  toast("Card database ready — "+all.length.toLocaleString()+" products");
}
function renderBuildProgress(){
  const b=state.build, bar=$("#buildBar"), txt=$("#buildTxt");
  if(bar) bar.style.width=(b.total?Math.round(b.done/b.total*100):0)+"%";
  if(txt) txt.textContent=b.done+" of "+b.total+" sets · "+b.cards.toLocaleString()+" products";
}

/* ---------- pricing ---------- */
/* In pattern-reverse sets (e.g. ME: Ascended Heroes) the patterned reverses are
   their own products, named "… (Energy Symbol Pattern)" / "… (Poké Ball)" etc.
   patternOf() returns a short label for such a product; "" for a base card. */
function patternOf(name){
  const m=String(name||"").match(/\(([^()]*)\)\s*$/);
  if(!m) return "";
  if(/energy/i.test(m[1])) return "Energy";
  const b=m[1].match(/([A-Za-z]+)\s*ball\b/i);
  if(b){ const w=/^poke$/i.test(b[1])?"Poké":b[1].charAt(0).toUpperCase()+b[1].slice(1).toLowerCase(); return w+" Ball"; }
  return "";
}
/* sort key for a card group's products — base card first, then Energy, then Ball patterns */
function patSort(name){
  const x=patternOf(name);
  return !x?0:/energy/i.test(x)?1:/master/i.test(x)?3:2;
}
async function getSetPricing(setId,force){
  if(force) delete state.priceCache[setId];
  if(state.priceCache[setId]) return state.priceCache[setId];
  const g=state.bySet.get(setId);
  const r=await apiGet(`/${(g&&g.cat)||CAT}/sets/${setId}/pricing`);
  const prices=r.prices||r.data||{};
  state.priceCache[setId]=prices;
  for(const pid in prices){
    const tcg=(prices[pid]&&prices[pid].tcg)||{};
    const all={}, priced={};
    for(const v in tcg){
      const o=tcg[v];
      if(o&&typeof o==="object"){
        const px=(o.market!=null?o.market:(o.low!=null?o.low:null));
        all[v]=px;
        if(px!=null) priced[v]=px;
      }
    }
    // prefer variants that actually have a price (drops empty catalog
    // subtypes); if none are priced, keep them all so nothing is lost
    let vp=Object.keys(priced).length?priced:all;
    const mp=prices[pid]&&prices[pid].manapool;
    if(!Object.keys(vp).length&&mp){ for(const k in mp){ if(typeof mp[k]==="number"){ vp={Default:mp[k]}; break; } } }
    if(Object.keys(vp).length) state.flatPrices[pid]=vp;
  }
  // Pattern-reverse sets: a card's patterned reverses are dedicated products
  // ("… (Energy Symbol Pattern)" / "… (Poké Ball)") sharing its number. The base
  // product's own "Reverse Holofoil" is then the price API double-counting, so
  // drop it. Trainer cards have no pattern siblings and are left untouched.
  if(g) for(const grp of g.groups){
    if(!grp.products.some(p=>patternOf(p.n))) continue;
    for(const p of grp.products){
      if(patternOf(p.n)) continue;                       // keep the pattern products
      const fp=state.flatPrices[String(p.i)];
      if(!fp) continue;
      const ks=Object.keys(fp);
      if(ks.some(k=>!/reverse/i.test(k)))                 // base keeps a non-reverse printing
        for(const k of ks) if(/^\s*reverse\s*holo/i.test(k)) delete fp[k];
    }
  }
  persistPrices();
  return prices;
}
/* display order: Normal, Holo, Reverse Holo, Energy, Poké Ball, Master Ball, other */
function variantRank(v){
  const s=String(v||"").toLowerCase();
  if(/master\s?ball/.test(s)) return 6;
  if(/pok[eé]\s?ball/.test(s)) return 5;
  if(/energy/.test(s)) return 4;
  if(/reverse/.test(s)) return 3;
  if(/normal/.test(s)) return 0;
  if(/holo|foil/.test(s)) return 1;
  return 7;
}
function variantsFor(pid){
  const vp=state.flatPrices[String(pid)];
  const ks=vp?Object.keys(vp):[];
  if(!ks.length) return ["Default"];
  return ks.slice().sort((a,b)=>variantRank(a)-variantRank(b)||a.localeCompare(b));
}
function primaryVariant(pid){
  const vs=variantsFor(pid);
  return vs.find(v=>!/reverse/i.test(v))||vs[0];
}
function priceOf(pid,variant){
  const vp=state.flatPrices[String(pid)];
  if(!vp) return null;
  return vp[variant]!=null?vp[variant]:null;
}

/* ---------- ownership ---------- */
function getQty(pid,variant){ const o=state.owned[String(pid)]; return (o&&o[variant])||0; }
function ownedTotal(pid){ const o=state.owned[String(pid)]; if(!o) return 0; let s=0; for(const v in o) s+=o[v]; return s; }
/* "none" | "partial" (some printings) | "complete" (≥1 of every printing) */
function ownState(pid){
  const variants=variantsFor(pid);
  let have=0;
  for(const v of variants) if(getQty(pid,v)>0) have++;
  if(have===0) return "none";
  return have>=variants.length?"complete":"partial";
}
/* same, rolled up across every product in a same-number card group */
function groupState(grp){
  let none=true, all=true;
  for(const p of grp.products){
    const s=ownState(p.i);
    if(s!=="none") none=false;
    if(s!=="complete") all=false;
  }
  return none?"none":all?"complete":"partial";
}
function setQty(pid,variant,qty){
  pid=String(pid); qty=Math.max(0,Math.floor(qty)||0);
  if(!state.owned[pid]) state.owned[pid]={};
  if(qty<=0) delete state.owned[pid][variant]; else state.owned[pid][variant]=qty;
  if(!Object.keys(state.owned[pid]).length) delete state.owned[pid];
  saveOwned(); persistPrices();
}
function productValue(pid){
  const o=state.owned[String(pid)]; if(!o) return 0;
  let s=0; for(const v in o) s+=o[v]*(priceOf(pid,v)||0);
  return s;
}
function isWished(pid){ return !!state.wishlist[String(pid)]; }
function toggleWish(pid){
  pid=String(pid);
  if(state.wishlist[pid]){ delete state.wishlist[pid]; removeFromAllFolders(pid); }
  else state.wishlist[pid]=1;
  saveWish(); persistPrices();
}
/* ---------- wishlist folders ---------- */
function genId(){ return "f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function wlFolder(id){ return state.wishFolders.find(f=>f.id===id)||null; }
function cardFolders(pid){ pid=String(pid); return state.wishFolders.filter(f=>f.items&&f.items[pid]); }
function folderHas(fid,pid){ const f=wlFolder(fid); return !!(f&&f.items&&f.items[String(pid)]); }
function folderCount(f){ return f&&f.items?Object.keys(f.items).length:0; }
function addFolder(name){
  name=(name||"").trim(); if(!name) return null;
  const f={id:genId(),name:name,items:{}};
  state.wishFolders.push(f); saveWishFolders(); return f;
}
function renameFolder(id,name){
  name=(name||"").trim(); if(!name) return;
  const f=wlFolder(id); if(f){ f.name=name; saveWishFolders(); }
}
function deleteFolder(id){
  state.wishFolders=state.wishFolders.filter(f=>f.id!==id);
  saveWishFolders();
}
function toggleCardFolder(pid,fid){
  pid=String(pid); const f=wlFolder(fid); if(!f) return;
  if(!f.items) f.items={};
  if(f.items[pid]) delete f.items[pid];
  else { f.items[pid]=1; if(!state.wishlist[pid]){ state.wishlist[pid]=1; saveWish(); } }
  saveWishFolders();
}
function removeFromAllFolders(pid){
  pid=String(pid); let ch=false;
  for(const f of state.wishFolders){ if(f.items&&f.items[pid]){ delete f.items[pid]; ch=true; } }
  if(ch) saveWishFolders();
}
async function quickToggle(pid){
  const e=cat(pid); if(!e) return;
  if(!state.priceCache[e.sid]){ try{ await getSetPricing(e.sid); }catch(err){} }
  const variants=variantsFor(pid);
  const o=state.owned[String(pid)]||{};
  if(ownState(pid)==="complete"){
    if(Object.keys(o).some(v=>o[v]>1)){ openProduct(pid); return; }
    for(const v of variants) setQty(pid,v,0);
  }else{
    for(const v of variants) if(getQty(pid,v)<1) setQty(pid,v,1);
  }
  renderActive();
}
/* corner check on a grouped (multi-version) card tile — marks every
   printing of every version, or clears them all */
async function quickToggleGroup(sid,key){
  const grp=findGroup(sid,key); if(!grp) return;
  const first=grp.products[0]&&cat(grp.products[0].i);
  if(first&&!state.priceCache[first.sid]){ try{ await getSetPricing(first.sid); }catch(err){} }
  for(const p of grp.products){
    const o=state.owned[String(p.i)]||{};
    if(Object.keys(o).some(v=>o[v]>1)){ openGroup(sid,key); return; }
  }
  const complete=groupState(grp)==="complete";
  for(const p of grp.products){
    for(const v of variantsFor(p.i)){
      if(complete) setQty(p.i,v,0);
      else if(getQty(p.i,v)<1) setQty(p.i,v,1);
    }
  }
  renderActive();
}

/* ---------- tracked sets ---------- */
function isTracked(sid){ return !!state.tracked[String(sid)]; }
function toggleTracked(sid){
  sid=String(sid);
  if(state.tracked[sid]) delete state.tracked[sid]; else state.tracked[sid]=1;
  saveTracked();
}
function isFav(sid){ return !!state.favorites[String(sid)]; }
function toggleFav(sid){
  sid=String(sid);
  if(state.favorites[sid]) delete state.favorites[sid]; else state.favorites[sid]=1;

}

/* ---------- catalog queries ---------- */
function cardsInSet(sid){ const g=state.bySet.get(sid); return g?g.cards:[]; }
function sealedInSet(sid){ const g=state.bySet.get(sid); return g?g.sealed:[]; }
function groupsInSet(sid){ const g=state.bySet.get(sid); return g?g.groups:[]; }
function findGroup(sid,key){
  const g=state.bySet.get(normSid(sid));
  return g&&g.groups?g.groups.find(x=>x.key===key):null;
}
function allSetsSorted(){
  return Array.from(state.bySet.entries()).map(([sid,g])=>({sid,name:g.name}))
    .sort((a,b)=>a.name.localeCompare(b.name));
}
function newestSets(n){
  return Array.from(state.bySet.entries()).map(([sid,g])=>({sid,name:g.name}))
    .sort((a,b)=>{ const an=+a.sid,bn=+b.sid; if(!isNaN(an)&&!isNaN(bn)) return bn-an;
      return String(b.sid).localeCompare(String(a.sid)); })
    .slice(0,n||10);
}
/* relevance score for a matched card — higher = better "Best match".
   Rewards exact/whole-word hits in the card name so that searching
   "Eevee V" surfaces "Eevee V" / "Eevee VMAX" above every plain "Eevee". */
function matchScore(name,setn,words,full){
  let s=0;
  if(name===full) s+=1000;                                  // exact name
  else if(name.indexOf(full)===0) s+=480;                   // name starts with query
  else if(full.indexOf(" ")>-1&&name.indexOf(full)>-1) s+=240; // full phrase inside name
  const nameWords=name.split(/\s+/);
  for(const w of words){
    if(nameWords.indexOf(w)>-1) s+=120;                     // query word IS a name word
    else if(nameWords.some(nw=>nw.indexOf(w)===0)) s+=70;   // a name word starts with it
    else if(name.indexOf(w)>-1) s+=22;                      // loose substring in name
    else if(setn.indexOf(w)>-1) s+=8;                       // only in the set name
  }
  s-=Math.min(name.length,40)*0.1;                          // tie-break: shorter names first
  return s;
}
function searchCatalog(term){
  const t=term.trim().toLowerCase(); if(!t) return [];
  const words=t.split(/\s+/).filter(Boolean);
  const scored=[];
  for(const c of state.catalog){
    const name=(c.n||"").toLowerCase();
    const setn=(c.s||"").toLowerCase();
    // match against the card/product name AND its set name, so searching a
    // set (e.g. "Evolving Skies") returns every card and sealed product in it
    const hay=name+" "+setn;
    if(words.every(w=>hay.indexOf(w)>-1)) scored.push({c,sc:matchScore(name,setn,words,t)});
  }
  // rank by relevance — this is the "Best match" order — then cap at 240
  scored.sort((a,b)=>b.sc-a.sc||(a.c.n||"").localeCompare(b.c.n||""));
  return scored.slice(0,240).map(x=>x.c);
}
function setStats(sid){
  const g=state.bySet.get(sid);
  const groups=(g&&g.groups)||[];
  let total=groups.length,owned=0,value=0;
  for(const grp of groups){
    let go=false;
    for(const p of grp.products){ if(ownedTotal(p.i)>0) go=true; value+=productValue(p.i); }
    if(go) owned++;
  }
  const seal=(g&&g.sealed)||[];
  let sealedOwned=0,sealedVal=0;
  for(const c of seal){ if(ownedTotal(c.i)>0){ sealedOwned++; sealedVal+=productValue(c.i); } }
  return {total,owned,value,sealedTotal:seal.length,sealedOwned,sealedVal};
}

/* ---------- value history (trend & movers) ---------- */
function totalWorth(){ let v=0; for(const pid in state.owned) v+=productValue(pid); return v; }
function logSnapshot(){
  const d=today(), total=totalWorth(), pv={};
  for(const pid in state.owned){ const v=productValue(pid); if(v>0) pv[pid]=Math.round(v*100)/100; }
  const h=state.history;
  if(h.length&&h[h.length-1].d===d) h[h.length-1]={d,total,pv};
  else h.push({d,total,pv});
  if(h.length>24) state.history=h.slice(h.length-24);
  saveHistory();
}
function trendInfo(){
  const h=state.history;
  if(h.length<2) return null;
  const last=h[h.length-1], first=h[0];
  const diff=last.total-first.total;
  return {diff, fromDate:first.d, pct:first.total>0?diff/first.total*100:0};
}
function moversInfo(){
  const h=state.history;
  if(h.length<2) return [];
  const last=h[h.length-1].pv||{}, first=h[0].pv||{};
  const ids=new Set([...Object.keys(last),...Object.keys(first)]);
  const out=[];
  for(const pid of ids){
    const d=(last[pid]||0)-(first[pid]||0);
    if(Math.abs(d)>=0.5&&cat(pid)) out.push({pid,diff:d});
  }
  out.sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));
  return out.slice(0,3);
}

/* ---------- news (PokéBeach, best-effort via CORS relay) ---------- */
async function loadNews(){
  if(state.newsLoading) return;
  state.newsLoading=true; state.news=null;
  if(state.tab==="home") renderHome();
  const relay="https://api.allorigins.win/raw?url="+encodeURIComponent(NEWS_FEED);
  try{
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),9000);
    const res=await fetch(relay,{signal:ctrl.signal});
    clearTimeout(t);
    if(!res.ok) throw 0;
    const xml=await res.text();
    const doc=new DOMParser().parseFromString(xml,"text/xml");
    const items=Array.from(doc.querySelectorAll("item")).slice(0,5).map(it=>({
      title:(it.querySelector("title")&&it.querySelector("title").textContent||"").trim(),
      link:(it.querySelector("link")&&it.querySelector("link").textContent||"").trim()
    })).filter(x=>x.title&&x.link);
    state.news=items.length?items:"error";
  }catch(e){ state.news="error"; }
  state.newsLoading=false;
  if(state.tab==="home") renderHome();
}

/* ============================================================
   CLOUD SYNC — optional, passphrase-based (Supabase + client-side
   AES-GCM encryption). Only the collection syncs; the catalog stays local.
   ============================================================ */
function syncConfigured(){ const s=state.sync; return !!(s.url&&s.key&&s.pass); }
function saveSyncConfig(){ try{ localStorage.setItem(LS_SYNC,JSON.stringify(state.sync)); }catch(e){} }
function clearDirty(){ state.dirty=false; try{ localStorage.removeItem(LS_DIRTY); }catch(e){} }
function syncDirty(){
  state.dirty=true;
  try{ localStorage.setItem(LS_DIRTY,"1"); }catch(e){}
  if(syncConfigured()) scheduleSyncPush();
}
function b64enc(bytes){
  let s=""; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(s);
}
function b64dec(str){ return Uint8Array.from(atob(str),c=>c.charCodeAt(0)); }
async function deriveKey(pass){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:enc.encode("pokevault-sync-v1"),iterations:100000,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function vaultId(pass){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("pokevault::"+pass));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function encryptBlob(obj,key){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  const both=new Uint8Array(iv.length+ct.byteLength);
  both.set(iv,0); both.set(new Uint8Array(ct),iv.length);
  return b64enc(both);
}
async function decryptBlob(b64,key){
  const raw=b64dec(b64);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(0,12)},key,raw.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function sbFetch(path,opts){
  const s=state.sync, base=s.url.trim().replace(/\/+$/,"").replace(/\/rest\/v1$/i,"").replace(/\/+$/,"");
  const res=await fetch(base+"/rest/v1/"+path,Object.assign({},opts,{
    headers:Object.assign({apikey:s.key,Authorization:"Bearer "+s.key},(opts&&opts.headers)||{})
  }));
  if(!res.ok){
    let detail="";
    try{ detail=((await res.text())||"").replace(/\s+/g," ").trim().slice(0,160); }catch(e){}
    throw new Error("Cloud error "+res.status+(detail?(": "+detail):""));
  }
  return res;
}
async function syncPull(){
  const id=await vaultId(state.sync.pass);
  const res=await sbFetch("vault?id=eq."+encodeURIComponent(id)+"&select=data",{method:"GET"});
  const rows=await res.json();
  if(!rows||!rows.length) return null;
  let key;
  try{ key=await deriveKey(state.sync.pass); return await decryptBlob(rows[0].data,key); }
  catch(e){ throw new Error("Wrong passphrase for this vault."); }
}
async function syncPush(){
  const id=await vaultId(state.sync.pass);
  const key=await deriveKey(state.sync.pass);
  const data=await encryptBlob({owned:state.owned,wishlist:state.wishlist,
    tracked:state.tracked,favorites:state.favorites,wishFolders:state.wishFolders},key);
  await sbFetch("vault",{method:"POST",
    headers:{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},
    body:JSON.stringify({id,data,updated_at:new Date().toISOString()})});
}
function applyVault(blob){
  if(blob.owned&&typeof blob.owned==="object") state.owned=blob.owned;
  if(blob.wishlist&&typeof blob.wishlist==="object") state.wishlist=blob.wishlist;
  if(blob.tracked&&typeof blob.tracked==="object") state.tracked=blob.tracked;
  if(blob.favorites&&typeof blob.favorites==="object") state.favorites=blob.favorites;
  if(Array.isArray(blob.wishFolders)) state.wishFolders=normFolders(blob.wishFolders);
  try{
    localStorage.setItem(LS_OWNED,JSON.stringify(state.owned));
    localStorage.setItem(LS_WISH,JSON.stringify(state.wishlist));
    localStorage.setItem(LS_TRACKED,JSON.stringify(state.tracked));
    localStorage.setItem(LS_FAV,JSON.stringify(state.favorites));
    localStorage.setItem(LS_WFOLDERS,JSON.stringify(state.wishFolders));
  }catch(e){}
  persistPrices();
  clearDirty();
}
function updateSyncUI(){ if(state.tab==="settings") renderSettings(); }
function scheduleSyncPush(){
  clearTimeout(scheduleSyncPush._t);
  state.syncStatus="pending"; updateSyncUI();
  scheduleSyncPush._t=setTimeout(doSyncPush,1600);
}
async function doSyncPush(){
  if(!syncConfigured()) return;
  state.syncStatus="syncing"; updateSyncUI();
  try{
    await syncPush();
    clearDirty(); state.syncStatus="ok"; state.syncedAt=Date.now(); state.syncError="";
  }catch(e){ state.syncStatus="error"; state.syncError=e.message||"sync failed"; }
  updateSyncUI();
}
async function initSync(){
  if(!syncConfigured()) return;
  state.syncStatus="syncing"; updateSyncUI();
  try{
    if(state.dirty){
      await syncPush(); clearDirty();
    }else{
      const blob=await syncPull();
      if(blob) applyVault(blob); else await syncPush();
    }
    state.syncStatus="ok"; state.syncedAt=Date.now(); state.syncError="";
    renderActive();
  }catch(e){ state.syncStatus="error"; state.syncError=e.message||"sync failed"; }
  updateSyncUI();
}
async function connectSync(){
  if(!(window.crypto&&crypto.subtle)){
    toast("Encryption needs a secure (https) link — open the hosted app, not a local file."); return;
  }
  const url=($("#syncUrl").value||"").trim().replace(/\/+$/,"").replace(/\/rest\/v1$/i,"").replace(/\/+$/,"");
  const key=($("#syncKey").value||"").trim();
  const pass=($("#syncPass").value||"").trim();
  if(!url||!key||!pass){ toast("Fill in all three sync fields"); return; }
  if(!/^https?:\/\//i.test(url)){ toast("The project URL should start with https://"); return; }
  state.sync={url,key,pass}; saveSyncConfig();
  state.syncStatus="syncing"; state.syncError=""; renderSettings();
  try{
    const blob=await syncPull();
    const haveLocal=Object.keys(state.owned).length>0||Object.keys(state.wishlist).length>0;
    if(blob){
      if(haveLocal && !confirm("This vault already has a saved collection.\n\nOK — load the cloud collection onto this device (replaces what's here).\nCancel — upload THIS device's collection to the vault instead.")){
        await syncPush(); clearDirty();
      }else{
        applyVault(blob);
      }
    }else{
      await syncPush(); clearDirty();
    }
    state.syncStatus="ok"; state.syncedAt=Date.now();
    toast("Cloud sync connected"); renderActive();
  }catch(e){
    state.syncStatus="error"; state.syncError=e.message||"sync failed";
    toast(e.message||"Couldn’t connect");
  }
  renderSettings();
}
function disconnectSync(){
  if(!confirm("Stop syncing on this device? Your collection stays here and the cloud copy is untouched.")) return;
  state.sync={url:"",key:"",pass:""};
  try{ localStorage.removeItem(LS_SYNC); }catch(e){}
  state.syncStatus=""; state.syncError="";
  renderSettings(); toast("Sync disconnected on this device");
}

drop policy if exists "pv" on vault;
