name: Build catalog
# Daily: crawl the TCGTracking API into a compressed catalog and append today's
# prices to the per-set history files. Everything is force-pushed to the orphan
# branch `catalog-data` (history files are carried over from the previous run).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "Backfill price history from this date (YYYY-MM-DD, earliest 2024-02-08). Leave empty for the normal daily run."
        required: false
        default: ""
permissions:
  contents: write
concurrency: catalog
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Fetch yesterday's price history
        run: |
          mkdir -p prev/hist
          if git fetch --depth=1 origin catalog-data 2>/dev/null; then
            git --work-tree=prev checkout FETCH_HEAD -- hist 2>/dev/null || true
            git --work-tree=prev checkout FETCH_HEAD -- catalog-fill.json 2>/dev/null || true
          fi
          ls prev/hist | wc -l
      - run: node scripts/build-catalog.mjs dist prev
      - name: Backfill price history (manual runs only)
        if: ${{ github.event.inputs.backfill_from != '' }}
        run: |
          sudo apt-get install -y -qq p7zip-full >/dev/null
          mkdir -p dist/hist && cp -r prev/hist/. dist/hist/ 2>/dev/null || true
          node scripts/backfill-prices.mjs dist/hist --from "${{ github.event.inputs.backfill_from }}"
      - run: node scripts/build-prices.mjs dist/hist ${{ github.event.inputs.backfill_from != '' && 'dist/hist' || 'prev/hist' }}
      - name: Publish to catalog-data branch
        run: |
          cd dist
          git init -q
          git checkout -q -b catalog-data
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add catalog.json.gz catalog-meta.json hist
          git add catalog-fill.json 2>/dev/null || true
          git commit -q -m "catalog + prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" catalog-data
